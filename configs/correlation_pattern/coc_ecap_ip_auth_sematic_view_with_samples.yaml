    sample_values:
    - '202604'
  time_dimensions:
  - name: incurred_month
    description: It is the four digit Julian year and two digit month of the Analytic
      Incurred Date.
    expr: INCRD_YEAR_MNTH_NBR
    data_type: number
    synonyms:
    - incurred_date
    - service_month
  facts:
  - name: member_count
    description: Count of members
    expr: ACTL_MBR_CNT
    data_type: number
    synonyms:
    - members
    - member_months
  metrics:
  - name: membership.total_members
    description: Total member count
    expr: SUM({membership.member_count})
  - name: membership.avg_members
    description: Average member count
    expr: AVG({membership.member_count})
relationships:
- name: expense_to_membership
  description: Join expense to membership by LOB and time period
  left_table: expense_detail
  right_table: membership
  relationship_columns:
  - left_column: LOB_CD
    right_column: LOB_CD
  - left_column: MBU_CF_CD
    right_column: MBU_CF_CD
  - left_column: SRVCAREA_ST_SHRT_DESC
    right_column: SRVCAREA_ST_SHRT_DESC
  - left_column: PROD_CD
    right_column: PROD_CD
  - left_column: SNAP_YEAR_MNTH_NBR
    right_column: SNAP_YEAR_MNTH_NBR
  - left_column: ANLYTC_INCRD_YEAR_MNTH_NBR
    right_column: INCRD_YEAR_MNTH_NBR
metrics:
- name: allowed_pmpm
  description: Allowed amount per member per month (expense / membership)
  expr: SUM({expense_detail.allowed_amount}) / NULLIF(SUM({membership.member_count}),
    0)
- name: paid_pmpm
  description: Paid amount per member per month (expense / membership)
  expr: SUM({expense_detail.paid_amount}) / NULLIF(SUM({membership.member_count}),
    0)
- name: admits_per_thousand
  description: Admissions per 1,000 members
  expr: (SUM({expense_detail.admit_count}) / NULLIF(SUM({membership.member_count}),
    0)) * 1000
  synonyms:
  - admits_per_k
  - admits_per_1k
  - admission_rate
filters:
- name: commercial_only
  description: Filter for Commercial line of business only
  synonyms:
  - commercial
  - comm
  expr: '{expense_detail.lob_description} = ''Commercial'''
- name: with_authorization
  description: Filter for claims that have an authorization
  synonyms:
  - auth_claims
  - authorized
  expr: '{expense_detail.authorization_key} > 0'
- name: in_network_only
  description: Filter for in-network claims only
  synonyms:
  - in_network
  - inn
  expr: '{expense_detail.in_network_indicator} = ''Y'''
- name: er_admits_only
  description: Filter for ER admission claims only
  synonyms:
  - er_admits
  - emergency_admits
  expr: '{expense_detail.er_admit_indicator} = ''Y'''
- name: high_cost_claims
  description: Filter for high-cost claims (allowed amount > $50,000)
  synonyms:
  - high_cost
  - expensive_claims
  expr: '{expense_detail.allowed_amount} > 50000'
- name: recent_12_months
  description: Filter for most recent 12 months of data
  synonyms:
  - last_12_months
  - trailing_12_months
  - ttm
  expr: '{expense_detail.incurred_month} >= CAST(TO_CHAR(DATEADD(month, -12, CURRENT_DATE()),
    ''YYYYMM'') AS NUMBER)'
analysis_modes:
- name: cost_change_investigation_over_time_window
  description: 'Explains how a selected cost metric changed between two comparable
    time periods. Its purpose is to identify: 1. what metric changed, 2. how much
    it changed, 3. which dimensions contributed most to the change, 4. and which drill-down
    path best localizes the change.

    This mode compares a prior period and a current period over the same metric, under
    a user-defined scope (for example CPT code, state, line of business, product,
    facility type, or other filters). It ranks candidate dimensions by contribution
    to the metric delta and generates SQL for iterative drill-down.

    This mode answers “where did the change happen?” and “which segments explain most
    of the change?” It does not prove clinical or contractual root cause.'
  drill_metric:
  - expense_detail.total_paid
  explainer_metrics:
  - expense_detail.claim_count
  - expense_detail.total_admissions
  - expense_detail.avg_paid_per_admit
  save_parquet: false
  disable_summary_creation: true
  generate_recommendations: false
  # - admits_per_thousand
  interaction_matrix:
    enabled: true
    trigger_rules:
      interaction_stage:
        min_abs_net_delta: 1000
        min_drill_path_depth: 2
        run_when_repeated_delta_ratio: 0.95
        run_when_low_volume: true
      clinical_stage:
        require_selected_operational_cells: true
        min_selected_operational_positive_delta: 1000
    categories:
      operational:
        dimensions:
        - pa_required_code
        - product_description
        - facility_type
        carry_through_dimensions:
        - service_area_state
        - lob_description
      clinical:
        dimensions:
        - drg_name
        - primary_diagnosis_name
        - hcc_medium
    selection_rules:
      operational:
        min_positive_delta: 1000
        min_share_of_positive_delta: 0.05
        max_cumulative_share_of_positive_delta: 0.80
        max_k: 5
        always_include_min_share_of_net_delta: 0.40
      clinical:
        min_positive_delta: 500
        min_share_of_positive_delta: 0.05
        max_cumulative_share_of_positive_delta: 0.90
        max_k: 10
        include_offsets: true
        max_offset_k: 3
    preview_limits:
      max_operational_cells: 5
      max_clinical_cells: 10
      max_recommendations: 5
    artifact_limits:
      max_rows_json_preview: 1000
  period:
    rolling_time_dimension: expense_detail.incurred_month
    current_period:
      start_time: null
      end_time: null
    previous_period:
      start_time: null
      end_time: null
  drill_dimensions:
  - service_area_state
  - hcc_medium
  - rendering_provider_name
  - facility_type
  - drg_name
  - product_description
  - primary_diagnosis_name
  - pa_required_code
  - er_admit_indicator
  exclude_if_filtered: true
  stop_rules:
    max_depth: 10
    top_k_per_level: 5
    min_abs_delta: 1000
    min_row_count: 1
    min_contribution_pct: 0.05
    min_incremental_gain_pct: 0.05
