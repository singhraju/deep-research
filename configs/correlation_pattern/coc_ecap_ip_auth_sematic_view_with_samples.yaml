name: coc_ecap_ip_auth_view
description: COC ECAP IP Authorization semantic view for claims expense and membership
  analysis
comments: 'This semantic view provides a unified view of COC ECAP data with:

  - Expense detail table with clinical and financial dimensions

  - Membership table for member-level analysis

  - Support for multi-dimensional trend analysis and authorization tracking

  '
tables:
- name: expense_detail
  description: Expense detail data with clinical and financial information
  base_table:
    database: P01_COC
    schema: COC_DTI_STG
    table: WORK_ELEVATE_COC_CLAIM_DETAIL
  dimensions:
  - name: lob_code
    description: LINE OF BUSINESS CODE is a unique code that represents the Line of
      Business.
    expr: LOB_CD
    data_type: string
    synonyms:
    - lob
    - line_of_business
    is_enum: true
    sample_values:
    - MCM003
    - MCM004
    - MCM006
  - name: lob_description
    description: LINE OF BUSINESS SHORT DESCRIPTION is the short description of the
      Line of Business Code.
    expr: LOB_SHRT_DESC
    data_type: string
    sample_values:
    - Commercial
    - Medicaid
    - Medicare
  - name: mbu_chartfield
    description: MARKETING BUSINESS UNIT CHARTFIELD CODE is a code which represents
      how products are marketed.
    expr: MBU_CF_CD
    data_type: string
    synonyms:
    - mbu
    - marketing_unit
  - name: service_area_state
    description: SERVICE AREA STATE SHORT DESCRIPTION is the description of the Service
      Area State Code.
    expr: SRVCAREA_ST_SHRT_DESC
    data_type: string
    synonyms:
    - state
    - service_state
    sample_values:
    - CA
    - CO
    - CT
    - FL
    - GA
    - IN
    - KY
    - MD
    - ME
    - MO
    - NH
    - NV
    - NY
    - OH
    - TX
    - VA
    - WI
  - name: state_name
    description: STATE NAME is the full name of the state.
    expr: ST_NM
    data_type: string
    synonyms:
    - state_full_name
    sample_values:
    - California
    - Colorado
    - Connecticut
    - Florida
    - Georgia
    - Indiana
    - Kentucky
    - Maine
    - Maryland
    - Missouri
    - Nevada
    - New Hampshire
    - New York
    - Ohio
    - Texas
    - Virginia
    - Wisconsin
  - name: hcc_high
    description: HCC COMMERCIAL MANAGEMENT HIGH SHORT DESCRIPTION for health care
      category high level.
    expr: HCC_CMRCL_MNGMNT_HIGH_SHRT_DESC
    data_type: string
    synonyms:
    - hcc_high_desc
    - health_category_high
    sample_values:
    - IP
  - name: hcc_medium
    description: HCC COMMERCIAL MANAGEMENT MEDIUM SHORT DESCRIPTION for health care
      category medium level.
    expr: HCC_CMRCL_MNGMNT_MEDM_SHRT_DESC
    data_type: string
    synonyms:
    - hcc_medium_desc
    - health_category_medium
    sample_values:
    - IP BH
    - IP Med/Surg
    - IP NICU
    - IP OB Dlvry/Well NB
    - NF
  - name: hcc_low
    description: HCC COMMERCIAL MANAGEMENT LOW SHORT DESCRIPTION for health care category
      low level.
    expr: HCC_CMRCL_MNGMNT_LOW_SHRT_DESC
    data_type: string
    synonyms:
    - hcc_low_desc
    - health_category_low
    sample_values:
    - IP BH
    - IP Med/Surg
    - IP NICU
    - IP OB Dlvry
    - IPAC - Well NB
    - NF
  - name: provider_id
    description: PROVIDER ID is the unique identifier for the provider.
    expr: PROV_ID
    data_type: string
    synonyms:
    - prov_id
  - name: rendering_provider_name
    description: Rendering Provider Name.
    expr: RNDRG_PROV_NM
    data_type: string
    synonyms:
    - provider_name
    - provider
  - name: rendering_hospital_system
    description: Hospital Name who the Rendering Provider is a part of.
    expr: RNDRG_HOSP_SYS_NM
    data_type: string
    synonyms:
    - hospital_system
    - hospital
  - name: facility_type
    description: FACILITY TYPE is the type of facility where services were provided.
    expr: FCLTY_TYPE
    data_type: string
    synonyms:
    - facility
  - name: drg_code
    description: DIAGNOSIS RELATED GROUP (DRG) CODE represents the specific DRG associated
      with a Claim.
    expr: FNL_DRG_CD
    data_type: string
    synonyms:
    - drg
  - name: drg_name
    description: DIAGNOSIS RELATED GROUP NAME is the name for the DRG code.
    expr: FNL_DRG_NM
    data_type: string
    synonyms:
    - drg_description
  - name: procedure_code
    description: PROCEDURE CODE is a code that defines a service that a Provider may
      deliver.
    expr: PROC_CD
    data_type: string
    synonyms:
    - proc_code
    - cpt
  - name: procedure_name
    description: PROCEDURE SHORT NAME is the short description for the procedure code.
    expr: PROC_SHRT_NM
    data_type: string
    synonyms:
    - proc_name
    - procedure_description
    - cpt
  - name: product_code
    description: PRODUCT CODE is a unique code that represents the Products.
    expr: PROD_CD
    data_type: string
    synonyms:
    - product
    sample_values:
    - PM0172
    - PM0173
    - PM0176
    - PM0218
    - PM0330
    - PM3561
    - PM4559
  - name: product_description
    description: PRODUCT SHORT DESCRIPTION of the product code.
    expr: PROD_SHRT_DESC
    data_type: string
    synonyms:
    - product_desc
    sample_values:
    - Commercial Behavioral Health
    - Commercial Med Supp
    - EPO
    - FFS
    - HMO
    - POS
    - PPO
  - name: primary_diagnosis_code
    description: PRIMARY DISCHARGE DIAGNOSIS CODE represents an ICD CM Diagnosis Code.
    expr: PRMRY_DSCHRG_DIAG_CD
    data_type: string
    synonyms:
    - diagnosis_code
    - diag_code
    - icd_code
  - name: primary_diagnosis_name
    description: PRIMARY DISCHARGE DIAGNOSIS NAME is the name for the diagnosis code.
    expr: PRMRY_DSCHRG_DIAG_NM
    data_type: string
    synonyms:
    - diagnosis_name
    - diag_name
  - name: pa_required_code
    description: PRIOR AUTHORIZATION REQUIRED CODE is an indicator that a prior authorization
      was required.
    expr: PA_RQRD_CD
    data_type: string
    synonyms:
    - pa_required
    - auth_required
    is_enum: true
    sample_values:
    - '-1'
    - '-2'
    - '-3'
    - N
    - Y
  - name: claim_number
    description: CLAIM NUMBER is a unique number assigned to a claim.
    expr: CLM_NBR
    data_type: string
    synonyms:
    - dcn
    - claim_id
  - name: in_network_indicator
    description: IN NETWORK INDICATOR shows if the provider is in network.
    expr: INN_IND
    data_type: string
    synonyms:
    - in_network
    - inn_ind
    is_enum: true
    sample_values:
    - N
    - Y
  - name: er_admit_indicator
    description: ER ADMIT INDICATOR shows if the admission was through emergency room.
    expr: ER_ADMT_IND
    data_type: string
    synonyms:
    - er_admit
    - emergency_admit
    is_enum: true
    sample_values:
    - N
    - Y
  time_dimensions:
  - name: snap_month
    description: SNAP YEAR MONTH NUMBER reflects the YYYYMM of the month end for which
      the data is produced.
    expr: SNAP_YEAR_MNTH_NBR
    data_type: number
    synonyms:
    - snap_date
    - snapshot_month
  - name: incurred_month
    description: It is the four digit Julian year and two digit month of the Analytic
      Incurred Date.
    expr: ANLYTC_INCRD_YEAR_MNTH_NBR
    data_type: number
    synonyms:
    - incurred_date
    - service_month
  facts:
  - name: lob_partition_id
    description: LOB PARTITION ID for partitioning.
    expr: LOB_PARTN_ID
    data_type: number
  - name: authorization_key
    description: EDM AUTHORIZATION KEY indicates if claim has any authorization request.
    expr: EDM_AUTHRZN_KEY
    data_type: number
    synonyms:
    - auth_key
  - name: drg_weight
    description: DRG WEIGHT NUMBER is the weight associated with the DRG.
    expr: DRG_WT_NBR
    data_type: number
    synonyms:
    - drg_weight_number
  - name: admit_count
    description: Count of derived admits.
    expr: ADMIT_CNT
    data_type: number
    synonyms:
    - admissions
    - admit
  - name: paid_amount
    description: Paid amount for the claim.
    expr: ANLYTC_PAID_AMT
    data_type: number
    synonyms:
    - paid
    - paid_amt
  - name: allowed_amount
    description: Allowed amount for covered medical services or supplies.
    expr: ANLYTC_ALWD_AMT
    data_type: number
    synonyms:
    - allowed
    - allowed_amt
  - name: billed_charge_amount
    description: BILLED CHARGE AMOUNT is the amount submitted by the provider for
      reimbursement.
    expr: BILLD_CHRG_AMT
    data_type: number
    synonyms:
    - billed
    - charges
  - name: claim_admit_key
    description: ANALYTIC CLAIM ADMIT KEY is the key for claim admission.
    expr: ANLYTC_CLM_ADMT_KEY
    data_type: number
  metrics:
  - name: expense_detail.total_allowed
    description: Total allowed amount
    expr: SUM({expense_detail.allowed_amount})
  - name: expense_detail.total_paid
    description: Total paid amount
    expr: SUM({expense_detail.paid_amount})
  - name: expense_detail.total_admissions
    description: Total admission count
    expr: SUM({expense_detail.admit_count})
  - name: expense_detail.claim_count
    description: Total count of claims
    expr: COUNT(DISTINCT {expense_detail.claim_number})
  - name: expense_detail.avg_billed_per_claim
    description: Average billed charge per claim
    expr: SUM({expense_detail.billed_charge_amount}) / NULLIF(COUNT(DISTINCT {expense_detail.claim_number}),
      0)
  - name: expense_detail.auth_rate
    description: Authorization rate (claims with auth / total claims)
    expr: SUM(CASE WHEN {expense_detail.authorization_key} > 0 THEN 1 ELSE 0 END)
      / NULLIF(COUNT(*), 0)
  - name: expense_detail.paid_ratio
    description: Ratio of paid to allowed amount
    expr: SUM({expense_detail.paid_amount}) / NULLIF(SUM({expense_detail.allowed_amount}),
      0)
  - name: expense_detail.avg_allowed_per_admit
    description: Average allowed amount per admission
    expr: SUM({expense_detail.allowed_amount}) / NULLIF(SUM({expense_detail.admit_count}),
      0)
  - name: expense_detail.avg_paid_per_admit
    description: Average paid amount per admission
    expr: SUM({expense_detail.paid_amount}) / NULLIF(SUM({expense_detail.admit_count}),
      0)
- name: membership
  description: Membership data for member counts and authorization tracking
  base_table:
    database: P01_COC
    schema: COC_DTI_STG
    table: WORK_ELEVATE_COC_MBR_DETAIL
  dimensions:
  - name: lob_code
    description: LINE OF BUSINESS CODE is a unique code that represents the Line of
      Business.
    expr: LOB_CD
    data_type: string
    synonyms:
    - lob
    - line_of_business
    is_enum: true
    sample_values:
    - MCM003
    - MCM004
    - MCM006
  - name: lob_description
    description: LINE OF BUSINESS SHORT DESCRIPTION is the short description of the
      Line of Business Code.
    expr: LOB_SHRT_DESC
    data_type: string
    sample_values:
    - Commercial
    - Medicaid
    - Medicare
  - name: mbu_chartfield
    description: MARKETING BUSINESS UNIT CHARTFIELD CODE is a code which represents
      how products are marketed.
    expr: MBU_CF_CD
    data_type: string
    synonyms:
    - mbu
    - marketing_unit
  - name: service_area_state
    description: SERVICE AREA STATE SHORT DESCRIPTION is the description of the Service
