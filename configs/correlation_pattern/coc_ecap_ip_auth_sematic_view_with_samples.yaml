  - name: product_code
    description: PRODUCT CODE is a unique code that represents the Products.
    expr: PROD_CD
    data_type: string
    synonyms:
    - product
    sample_values:
    - PM0172
    - PM0173
    - PM0176
    - PM0330
    - PM3561
    - PM4559
  - name: product_description
    description: PRODUCT SHORT DESCRIPTION of the product code.
    expr: PROD_SHRT_DESC
    data_type: string
    synonyms:
    - product_desc
    sample_values:
    - Commercial Med Supp
    - EPO
