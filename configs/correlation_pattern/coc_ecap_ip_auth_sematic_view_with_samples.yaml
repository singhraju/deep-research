    expr: SRVCAREA_ST_SHRT_DESC
    data_type: string
    synonyms:
    - state
    - service_state
    sample_values:
    - CA
    - CO
    - CT
    - FL
    - GA
    - IN
    - KY
    - MD
    - ME
    - MO
    - NH
    - NV
    - NY
    - OH
    - TX
    - VA
