  - name: DDIM_BNFT_PLAN_CUBE
    description: The table contains records of benefit plans and their associated product classifications. Each record represents a snapshot of a benefit plan at a point in time, capturing details about the plan's line of business, product hierarchy (including product line, segment, and sub-segment), membership aggregation, and benefit class categorizations such as metal tier and certification type.
    base_table:
      database: D01_COC
      schema: COC_NOPHI
      table: DDIM_BNFT_PLAN_CUBE
    dimensions:
      - name: BNFT_CLS_CD
        description: The benefit class code.
        expr: BNFT_CLS_CD
        data_type: VARCHAR(6) COLLATE 'utf8'
      - name: BNFT_CLS_SHRT_DESC
        description: Short description of the benefit class.
        expr: BNFT_CLS_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: BNFT_PLAN_CD
        description: The benefit plan code.
        expr: BNFT_PLAN_CD
        data_type: VARCHAR(12) COLLATE 'utf8'
      - name: BNFT_PLAN_NM
        description: The name of the benefit plan.
        expr: BNFT_PLAN_NM
        data_type: VARCHAR(150) COLLATE 'utf8'
      - name: CDHP_SHRT_DESC
        description: Short description of a Consumer-Directed Health Plan (CDHP).
        expr: CDHP_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: CERTFN_SHRT_DESC
        description: A short description of the certification.
        expr: CERTFN_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: DTL_PROD_SHRT_DESC
        description: Short description of the detailed product.
        expr: DTL_PROD_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: HCR_SHRT_DESC
        description: Short description of the Healthcare Reform (HCR) benefit plan.
        expr: HCR_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: LOB_CD
        description: The line of business code.
        expr: LOB_CD
        data_type: VARCHAR(6) COLLATE 'utf8'
      - name: LOB_SHRT_DESC
        description: Short description of the line of business (LOB).
        expr: LOB_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: MBRSHP_AGRGT_CD
        description: A code representing the membership aggregate category.
        expr: MBRSHP_AGRGT_CD
        data_type: VARCHAR(4) COLLATE 'utf8'
      - name: MBRSHP_AGRGT_NM
        description: The aggregate membership name associated with a benefit plan.
        expr: MBRSHP_AGRGT_NM
        data_type: VARCHAR(150) COLLATE 'utf8'
      - name: METL_SHRT_DESC
        description: Short description of the metal tier level associated with a benefit plan.
        expr: METL_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: PROD_LINE_SHRT_DESC
        description: Short description of the product line.
        expr: PROD_LINE_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: PROD_SGMNT_CD
        description: A short code identifying the product segment.
        expr: PROD_SGMNT_CD
        data_type: VARCHAR(6) COLLATE 'utf8'
      - name: PROD_SGMNT_SHRT_DESC
        description: Short description of the product segment.
        expr: PROD_SGMNT_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: PROD_SHRT_DESC
        description: The short description of the product.
        expr: PROD_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: PROD_SUB_SGMNT_CD
        description: A code identifying the product sub-segment classification.
        expr: PROD_SUB_SGMNT_CD
        data_type: VARCHAR(6) COLLATE 'utf8'
      - name: PROD_SUB_SGMNT_SHRT_DESC
        description: Short description of the product sub-segment.
        expr: PROD_SUB_SGMNT_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: SUB_PROD_CD
        description: The sub-product code identifying a specific subdivision or variant within a broader product category.
        expr: SUB_PROD_CD
        data_type: VARCHAR(6) COLLATE 'utf8'
      - name: SUB_PROD_SHRT_DESC
        description: Short description of the sub-product.
        expr: SUB_PROD_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
    facts:
      - name: AUDT_JOB_CNTRL_ID
        description: The unique identifier for the audit job control process associated with the record.
        expr: AUDT_JOB_CNTRL_ID
        data_type: NUMBER(38,0)
        access_modifier: public_access
      - name: BNFT_PLAN_KEY
        description: Surrogate key uniquely identifying a benefit plan record in the dimension table.
        expr: BNFT_PLAN_KEY
        data_type: NUMBER(38,0)
        access_modifier: public_access
      - name: SNAP_YEAR_MNTH_NBR
        description: The year and month number associated with a snapshot, typically formatted as YYYYMM.
        expr: SNAP_YEAR_MNTH_NBR
        data_type: NUMBER(38,0)
        access_modifier: public_access
