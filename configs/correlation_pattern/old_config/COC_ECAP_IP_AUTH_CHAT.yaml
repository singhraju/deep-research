  - name: DDIM_MBU_CF
    description: The table contains records of business unit cost center classifications and their associated attributes. Each record captures dimensional details including brand type, product line, service area state, and line of business, along with their corresponding codes and descriptions at varying levels of detail.
    base_table:
      database: D01_COC
      schema: COC_NOPHI
      table: DDIM_MBU_CF
    dimensions:
      - name: LOB_CD
        description: A short code identifying the line of business.
        expr: LOB_CD
        data_type: VARCHAR(6) COLLATE 'utf8'
      - name: LOB_LONG_DESC
        description: The long-form description of the line of business.
        expr: LOB_LONG_DESC
        data_type: VARCHAR(150) COLLATE 'utf8'
      - name: LOB_SHRT_DESC
        description: Short description of the line of business.
        expr: LOB_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: MBU_BRND_TYPE_CD
        description: A short code identifying the brand type of the member business unit.
        expr: MBU_BRND_TYPE_CD
        data_type: VARCHAR(6) COLLATE 'utf8'
      - name: MBU_BRND_TYPE_LONG_DESC
        description: The long-form description of the member business unit brand type.
        expr: MBU_BRND_TYPE_LONG_DESC
        data_type: VARCHAR(150) COLLATE 'utf8'
      - name: MBU_BRND_TYPE_SHRT_DESC
        description: The short description of the member business unit brand type.
        expr: MBU_BRND_TYPE_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: MBU_CF_CD
        description: A six-character code identifying a member business unit cost function.
        expr: MBU_CF_CD
        data_type: VARCHAR(6) COLLATE 'utf8'
      - name: MBU_CF_NM
        description: The name of the member business unit cost center.
        expr: MBU_CF_NM
        data_type: VARCHAR(150) COLLATE 'utf8'
      - name: MBU_CLS_CD
        description: The classification code assigned to the member unit (MBU).
        expr: MBU_CLS_CD
        data_type: VARCHAR(6) COLLATE 'utf8'
      - name: MBU_CLS_LONG_DESC
        description: The long descriptive name or label for a member business unit classification.
        expr: MBU_CLS_LONG_DESC
        data_type: VARCHAR(150) COLLATE 'utf8'
      - name: MBU_CLS_SHRT_DESC
        description: The short description of the member unit classification.
        expr: MBU_CLS_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: MBU_SUB_CLS_CD
        description: The sub-classification code for the Member Business Unit (MBU).
        expr: MBU_SUB_CLS_CD
        data_type: VARCHAR(6) COLLATE 'utf8'
      - name: MBU_SUB_CLS_LONG_DESC
        description: The long descriptive name of the member business unit sub-classification.
        expr: MBU_SUB_CLS_LONG_DESC
        data_type: VARCHAR(150) COLLATE 'utf8'
      - name: MBU_SUB_CLS_SHRT_DESC
        description: The short description of the member business unit sub-classification.
        expr: MBU_SUB_CLS_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: MBU_TYPE_CD
        description: A short code identifying the type of member business unit.
        expr: MBU_TYPE_CD
        data_type: VARCHAR(6) COLLATE 'utf8'
      - name: MBU_TYPE_LONG_DESC
        description: The full-length descriptive label for the member business unit type.
        expr: MBU_TYPE_LONG_DESC
        data_type: VARCHAR(150) COLLATE 'utf8'
      - name: MBU_TYPE_SHRT_DESC
        description: Short description of the member business unit type.
        expr: MBU_TYPE_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: PROD_LINE_CD
        description: A short code identifying the product line.
        expr: PROD_LINE_CD
        data_type: VARCHAR(6) COLLATE 'utf8'
      - name: PROD_LINE_LONG_DESC
        description: The full-length descriptive name of a product line.
        expr: PROD_LINE_LONG_DESC
        data_type: VARCHAR(150) COLLATE 'utf8'
      - name: PROD_LINE_SHRT_DESC
        description: The short description of the product line.
        expr: PROD_LINE_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
      - name: SRVCAREA_ST_CD
        description: The two-letter state code associated with the service area.
        expr: SRVCAREA_ST_CD
        data_type: VARCHAR(7) COLLATE 'utf8'
      - name: SRVCAREA_ST_LONG_DESC
        description: The full descriptive name of the service area state.
        expr: SRVCAREA_ST_LONG_DESC
        data_type: VARCHAR(150) COLLATE 'utf8'
      - name: SRVCAREA_ST_SHRT_DESC
        description: The short description of the service area state.
        expr: SRVCAREA_ST_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
    facts:
      - name: AUDT_JOB_CNTRL_ID
        description: The unique identifier for the audit job control record associated with the row.
        expr: AUDT_JOB_CNTRL_ID
        data_type: NUMBER(38,0)
        access_modifier: public_access
      - name: EDM_DATA_GRP_NBR
