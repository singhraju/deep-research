  - name: COC_IP_AUTH_DATA_INSGHT_STG
    description: The table contains records of insurance prior authorization data, capturing approval statuses, appeal outcomes, and medical necessity review requirements. Each record includes details about line of business, risk entity groupings, HCC medical groupings, and trending metrics across defined time periods and trend slices.
    base_table:
      database: D01_COC
      schema: COC_DTI_STG
      table: COC_IP_AUTH_DATA_INSGHT_STG
    dimensions:
      - name: APPEAL_STATUS
        description: The status of an appeal.
        expr: APPEAL_STATUS
        data_type: VARCHAR(15) COLLATE 'utf8'
        sample_values:
          - ALL
          - OVERTURNED
          - RESOLVED UPHELD
      - name: AUTH_REVIEW_STTS_RSN_GRP
        description: The grouped categorization of the reason associated with an authorization review status.
        expr: AUTH_REVIEW_STTS_RSN_GRP
        data_type: VARCHAR(50) COLLATE 'utf8'
        sample_values:
          - ALL
          - MEDICAL
          - ADMINISTRATIVE
      - name: AUTH_STATUS
        description: The authorization status of an inpatient request or claim.
        expr: AUTH_STATUS
        data_type: VARCHAR(150) COLLATE 'utf8'
        sample_values:
          - ALL
          - Not Approved
      - name: IS_APPEALD
        description: Indicates whether an inpatient authorization has been appealed.
        expr: IS_APPEALD
        data_type: VARCHAR(3) COLLATE 'utf8'
        sample_values:
          - 'N'
          - ALL
      - name: LOB_CD
        description: Line of business code.
        expr: LOB_CD
        data_type: VARCHAR(6) COLLATE 'utf8'
        sample_values:
          - MCM006
          - MCM004
          - MCM003
      - name: LOB_SHRT_DESC
        description: Short description of the line of business associated with the record.
        expr: LOB_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
        sample_values:
          - Medicaid
          - Commercial
          - Medicare
      - name: MEDICAL_NSCCTY_RVW_RQRD
        description: Indicates whether a medical necessity review is required.
        expr: MEDICAL_NSCCTY_RVW_RQRD
        data_type: VARCHAR(3) COLLATE 'utf8'
        sample_values:
          - 'Y'
          - ALL
          - 'N'
      - name: RISK_ENTITY_CD
        description: A code identifying the risk entity.
        expr: RISK_ENTITY_CD
        data_type: VARCHAR(7) COLLATE 'utf8'
        sample_values:
          - ALL
      - name: RISK_ENTITY_GRP
        description: The grouping or category used to classify risk entities.
        expr: RISK_ENTITY_GRP
        data_type: VARCHAR(50) COLLATE 'utf8'
        sample_values:
          - ALL
      - name: TRND_MEDM_GRP_HCC_CD
        description: Hierarchical Condition Category code associated with a trending medium group.
        expr: TRND_MEDM_GRP_HCC_CD
        data_type: VARCHAR(8) COLLATE 'utf8'
        sample_values:
          - ALL
          - HCC00476
          - HCC00007
      - name: TRND_MEDM_GRP_HCC_SHRT_DESC
        description: Short description of the trend medium group Hierarchical Condition Category.
        expr: TRND_MEDM_GRP_HCC_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
        sample_values:
          - NF
          - ALL
          - IP Med/Surg
      - name: TRND_MTRC_CD
        description: Trend metric codes used to categorize and identify different types of authorization and cost performance measurements.
        expr: TRND_MTRC_CD
        data_type: VARCHAR(19) COLLATE 'utf8'
        sample_values:
          - Auth per K
          - Admits per K
          - Auth Count
      - name: TRND_SLICE_CD
        description: A code identifying the trend slice dimension used for analytical segmentation.
        expr: TRND_SLICE_CD
        data_type: VARCHAR(15) COLLATE 'utf8'
        sample_values:
          - DRG
          - ST
          - RNDRG_PROV
      - name: TRND_SLICE_LNG_DESC
        description: Long description of the trend slice used for grouping or categorizing inpatient authorization data insights.
        expr: TRND_SLICE_LNG_DESC
        data_type: VARCHAR(200) COLLATE 'utf8'
        sample_values:
          - UNITYPOINT HEALTH - IOWA METHODIST MEDICAL CENTER
          - CO
          - Chemotherapy without Acute Leukemia as Secondary Diagnosis with CC
      - name: TRND_SLICE_SHRT_DESC
        description: Short description of the trend slice, representing a geographic or categorical segment used for data analysis.
        expr: TRND_SLICE_SHRT_DESC
        data_type: VARCHAR(50) COLLATE 'utf8'
        sample_values:
          - '050060'
          - '999'
          - CO
      - name: TRND_TM_PRD_CD
        description: The trend time period code used to categorize data across different time intervals.
        expr: TRND_TM_PRD_CD
        data_type: VARCHAR(15) COLLATE 'utf8'
        sample_values:
          - YTD
          - R6
          - R12
    facts:
      - name: SNAP_YEAR_MNTH_NBR
        description: The year and month snapshot number associated with the record.
        expr: SNAP_YEAR_MNTH_NBR
        data_type: NUMBER(38,0)
        sample_values:
          - '202603'
      - name: TRND_MTRC_VAL
        description: The trend metric value associated with an insight record.
        expr: TRND_MTRC_VAL
        data_type: NUMBER(38,8)
        sample_values:
          - '0.00000000'
          - '4.44000000'
          - '1.16400000'
      - name: TRND_TM_PRD_END_MNTH_NBR
        description: The ending month number of the trending time period.
        expr: TRND_TM_PRD_END_MNTH_NBR
        data_type: NUMBER(38,0)
        sample_values:
          - '202512'
