verified_queries:
- name: total_allowed_by_lob
  question: What is the total allowed amount by line of business?
  verified_by: Data Analytics Team
  verified_at: 1708905600
  use_as_onboarding_question: true
  sql: "SELECT \n  ce.LOB_SHRT_DESC as line_of_business,\n  SUM(ce.ANLYTC_ALWD_AMT)\
    \ as total_allowed\nFROM NON_CRTFD_AIFS.DL_DV_TMBR.AH45807_CHAT_BOT_CLM_EXPNS\
    \ ce\nGROUP BY ce.LOB_SHRT_DESC\nORDER BY total_allowed DESC\n"
- name: pmpm_trend_by_state
  question: Show me the allowed PMPM trend by state for the last 6 months
  verified_by: Data Analytics Team
  verified_at: 1708905600
  use_as_onboarding_question: true
  sql: "SELECT \n  ce.SRVCAREA_ST_SHRT_DESC as state,\n  ce.SNAP_YEAR_MNTH_NBR as\
    \ month,\n  SUM(ce.ANLYTC_ALWD_AMT) / NULLIF(SUM(am.ACTL_MBR_CNT), 0) as allowed_pmpm\n\
    FROM NON_CRTFD_AIFS.DL_DV_TMBR.AH45807_CHAT_BOT_CLM_EXPNS ce\nLEFT JOIN NON_CRTFD_AIFS.DL_DV_TMBR.AH45807_CHAT_BOT_AUTH_MBRSHP\
    \ am\n  ON ce.LOB_CD = am.LOB_CD\n  AND ce.MBU_CF_CD = am.MBU_CF_CD\n  AND ce.MBU_CLS_SHRT_DESC\
    \ = am.MBU_CLS_SHRT_DESC\n  AND ce.SRVCAREA_ST_SHRT_DESC = am.SRVCAREA_ST_SHRT_DESC\n\
    \  AND ce.PROD_CD = am.PROD_CD\n  AND ce.SNAP_YEAR_MNTH_NBR = am.SNAP_YEAR_MNTH_NBR\n\
    \  AND ce.ANLYTC_INCRD_YEAR_MNTH_NBR = am.INCRD_YEAR_MNTH_NBR\nWHERE ce.ANLYTC_INCRD_YEAR_MNTH_NBR\
    \ >= CAST(TO_CHAR(DATEADD(month, -6, CURRENT_DATE()), 'YYYYMM') AS NUMBER)\n \
    \ AND am.INCRD_YEAR_MNTH_NBR >= CAST(TO_CHAR(DATEADD(month, -6, CURRENT_DATE()),\
    \ 'YYYYMM') AS NUMBER)\nGROUP BY ce.SRVCAREA_ST_SHRT_DESC, ce.INCRD_YEAR_MNTH_NBR\n\
    ORDER BY state, month\n"
- name: top_drgs_by_cost
  question: What are the top 10 DRGs by total allowed amount?
  verified_by: Data Analytics Team
  verified_at: 1708905600
  use_as_onboarding_question: true
  sql: "SELECT \n  ce.FNL_DRG_NM as drg_name,\n  ce.FNL_DRG_CD as drg_code,\n  SUM(ce.ANLYTC_ALWD_AMT)\
    \ as total_allowed,\n  SUM(ce.ADMIT_CNT) as total_admits,\n  SUM(ce.ANLYTC_ALWD_AMT)\
    \ / NULLIF(SUM(ce.ADMIT_CNT), 0) as avg_allowed_per_admit\nFROM NON_CRTFD_AIFS.DL_DV_TMBR.AH45807_CHAT_BOT_CLM_EXPNS\
    \ ce\nWHERE ce.FNL_DRG_NM IS NOT NULL\nGROUP BY ce.FNL_DRG_NM, ce.FNL_DRG_CD\n\
    ORDER BY total_allowed DESC\nLIMIT 10\n"
- name: auth_approval_rate_by_product
  question: What is the authorization approval rate by product?
  verified_by: Data Analytics Team
  verified_at: 1708905600
  sql: "SELECT \n  ce.PROD_SHRT_DESC as product,\n  COUNT(DISTINCT ce.CLM_NBR) as\
    \ total_claims,\n  SUM(CASE WHEN ce.EDM_AUTHRZN_KEY IS NOT NULL THEN 1 ELSE 0\
    \ END) as claims_with_auth,\n  SUM(CASE WHEN ce.APPROVED_AUTH_KEY IS NOT NULL\
    \ THEN 1 ELSE 0 END) as approved_auth_claims,\n  SUM(CASE WHEN ce.APPROVED_AUTH_KEY\
    \ IS NOT NULL THEN 1 ELSE 0 END) * 100.0 / \n    NULLIF(SUM(CASE WHEN ce.EDM_AUTHRZN_KEY\
    \ IS NOT NULL THEN 1 ELSE 0 END), 0) as approval_rate_pct\nFROM NON_CRTFD_AIFS.DL_DV_TMBR.AH45807_CHAT_BOT_CLM_EXPNS\
    \ ce\nWHERE ce.EDM_AUTHRZN_KEY IS NOT NULL\nGROUP BY ce.PROD_SHRT_DESC\nORDER\
    \ BY approval_rate_pct DESC\n"
- name: member_count_trend
  question: Show me the member count trend over time
  verified_by: Data Analytics Team
  verified_at: 1708905600
  use_as_onboarding_question: true
  sql: "SELECT \n  am.SNAP_YEAR_MNTH_NBR as month,\n  am.LOB_SHRT_DESC as line_of_business,\n\
    \  SUM(am.ACTL_MBR_CNT) as total_members\nFROM NON_CRTFD_AIFS.DL_DV_TMBR.AH45807_CHAT_BOT_AUTH_MBRSHP\
    \ am\nGROUP BY am.SNAP_YEAR_MNTH_NBR, am.LOB_SHRT_DESC\nORDER BY month, line_of_business\n"
analysis_modes:
  - name: cost_change_investigation_over_time_window
    description: 'Explains how a selected cost metric changed between two comparable time periods.
      Its purpose is to identify:
      1. what metric changed,
      2. how much it changed,
      3. which dimensions contributed most to the change,
      4. and which drill-down path best localizes the change.

      This mode compares a prior period and a current period over the same metric, under a user-defined scope (for example CPT code, state, line of business, product, facility type, or other filters). It ranks candidate dimensions by contribution to the metric delta and generates SQL for iterative drill-down.

      This mode answers “where did the change happen?” and “which segments explain most of the change?” It does not prove clinical or contractual root cause.'
    drill_metric: 
      - claims_expense.total_paid
      - claims_expense.total_allowed
    explainer_metrics:
      - claims_expense.claim_count
      - claims_expense.total_admissions
      - claims_expense.avg_paid_per_admit
      - paid_pmpm
      - admits_per_thousand
    period:
      rolling_time_dimension: claims_expense.incurred_month
      current_period:
        start_time:
        end_time:
      previous_period:
        start_time:
        end_time:
    drill_dimensions:
      - mbu_cls_short_description
      - service_area_state
      - hcc_medium
      - rendering_provider_name
      - rendering_hospital_system
      - facility_type
      - drg_name
      - procedure_name
      - product_description
      - primary_diagnosis_name
      - pa_required_code
    exclude_if_filtered: true
    stop_rules:
      max_depth: 10
      top_k_per_level: 5
      min_abs_delta: 1000
      min_row_count: 1
      min_contribution_pct: 0.05
      min_incremental_gain_pct: 0.05