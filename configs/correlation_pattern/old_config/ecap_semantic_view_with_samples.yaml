    description: Total member count
    expr: SUM({auth_membership.member_count})
  - name: auth_membership.avg_members
    description: Average member count
    expr: AVG({auth_membership.member_count})
  filters:
  - name: current_year
    description: Filter for current year data (2026)
    synonyms:
    - this_year
    - cy
    expr: '{auth_membership.incurred_month} >= 202601 AND {auth_membership.incurred_month}
      <= 202612'
  - name: prior_year
    description: Filter for prior year data (2025)
    synonyms:
    - last_year
    - py
    expr: '{auth_membership.incurred_month} >= 202501 AND {auth_membership.incurred_month}
      <= 202512'
relationships:
- name: claims_to_membership
  description: Join claims to membership by LOB, MBU, state, product, and time period
  left_table: claims_expense
  right_table: auth_membership
  relationship_columns:
  - left_column: LOB_CD
    right_column: LOB_CD
  - left_column: MBU_CF_CD
    right_column: MBU_CF_CD
  - left_column: MBU_CLS_SHRT_DESC
    right_column: MBU_CLS_SHRT_DESC
  - left_column: SRVCAREA_ST_SHRT_DESC
    right_column: SRVCAREA_ST_SHRT_DESC
  - left_column: PROD_CD
    right_column: PROD_CD
  - left_column: SNAP_YEAR_MNTH_NBR
    right_column: SNAP_YEAR_MNTH_NBR
  - left_column: ANLYTC_INCRD_YEAR_MNTH_NBR
    right_column: INCRD_YEAR_MNTH_NBR
metrics:
- name: allowed_pmpm
  description: Allowed amount per member per month (claims expense / membership)
  expr: SUM({claims_expense.allowed_amount}) / NULLIF(SUM({auth_membership.member_count}),
    0)
- name: paid_pmpm
  description: Paid amount per member per month (claims expense / membership)
  expr: SUM({claims_expense.paid_amount}) / NULLIF(SUM({auth_membership.member_count}),
    0)
- name: admits_per_thousand
  description: Admissions per 1,000 members (Admits per k trend)
  expr: (SUM({claims_expense.admit_count}) / NULLIF(SUM({auth_membership.member_count}),
    0)) * 1000
  synonyms:
  - admits_per_k
  - admits_per_1k
  - admission_rate
- name: allowed_per_admit
  description: Allowed cost per admission (Cost per Admit trend)
  expr: SUM({claims_expense.allowed_amount}) / NULLIF(SUM({claims_expense.admit_count}),
    0)
  synonyms:
  - cost_per_admit
  - allowed_cost_per_admit
