name: ecap_view
description: ECAP semantic view for claims, authorizations, and membership analysis
comments: 'This semantic view provides a unified view of ECAP data with:

  - Claims expense table with clinical and financial dimensions

  - Authorization and membership table for member-level analysis

  - Support for multi-dimensional trend analysis and spike detection

  '
tables:
- name: claims_expense
  description: Claims and expense data with clinical and financial details
  base_table:
    database: NON_CRTFD_AIFS
    schema: DL_DV_TMBR
    table: AH45807_CHAT_BOT_CLM_EXPNS
  dimensions:
  - name: lob_code
    description: 'LINE OF BUSINESS CODE is a unique code that represents the Line
      of Business. Ex: Commercial, Medicare, or Medicaid.'
    expr: LOB_CD
    data_type: string
    synonyms:
    - lob
    - line_of_business
    sample_values:
    - MCM003
    - MCM004
    - MCM006
    is_enum: true
  - name: lob_description
    description: LINE OF BUSINESS SHORT DESCRIPTION is the short description of the
      Line of Business Code.
    expr: LOB_SHRT_DESC
    data_type: string
    sample_values:
    - Commercial
    - Medicaid
    - Medicare
  - name: mbu_chartfield
    description: MARKETING BUSINESS UNIT CHARTFIELD CODE is a code which represents
      how products are marketed at Anthem.
    expr: MBU_CF_CD
    data_type: string
    synonyms:
    - mbu
    - marketing_unit
  - name: mbu_cls_short_description
    description: MARKETING BUSINESS UNIT CLASS SHORT DESCRIPTION is the short description
      text for the individual code value.
    expr: MBU_CLS_SHRT_DESC
    data_type: string
    synonyms:
    - mbu_class_short_description
    - marketing_unit_class_short_description
    sample_values:
    - Commercial Ind Blue
    - Commercial Ind Green
    - Large Group
    - Medicaid
    - Medicare
    - National
    - Small Group
  - name: service_area_state
    description: 'SERVICE AREA STATE SHORT DESCRIPTION is the description of the Service
      Area State Code in the format of 2 character state abbreviation.'
    expr: SRVCAREA_ST_SHRT_DESC
    data_type: string
    synonyms:
    - state
    - service_state
    sample_values:
    - AR
    - AZ
    - CA
    - CO
    - CT
    - DC
    - FL
    - GA
    - IA
    - IN
    - KS
    - KY
    - LA
    - MD
    - ME
    - MO
    - NC
    - NH
    - NJ
    - NM
    - NV
    - NY
    - OH
    - PA
    - TN
    - TX
    - VA
    - WA
    - WI
    - WV
  # - name: hcc_high
  #   description: Used to represent the short description for HCC High Code. HEALTH
  #     CARE CATEGORY CODE is a code assigned to expenses, revenue and membership and
  #     enables expenses and revenue to be categorized into meaningful report groupings.
  #     This categorization allows analysis of similar buckets of information to be
  #     grouped together in order to understand trends and generate reporting needs.
  #   expr: HCC_CMRCL_MNGMNT_HIGH_SHRT_DESC
  #   data_type: string
  #   synonyms:
  #   - hcc_high_desc
  #   - health_category_high
  #   sample_values:
  #   - IP
  - name: hcc_medium
    description: Used to represent the short description for HCC Medium Code. HEALTH
      CARE CATEGORY CODE is a code assigned to expenses, revenue and membership and
      enables expenses and revenue to be categorized into meaningful report groupings.
      This categorization allows analysis of similar buckets of information to be
      grouped together in order to understand trends and generate reporting needs.
    expr: HCC_CMRCL_MNGMNT_MEDM_SHRT_DESC
    data_type: string
    synonyms:
    - hcc_medium_desc
    - health_category_medium
    sample_values:
    - IP BH
    - IP Med/Surg
    - IP NICU
    - IP OB Dlvry/Well NB
    - NF
  # - name: hcc_low
  #   description: Used to represent the short description for HCC Low Code. HEALTH
  #     CARE CATEGORY CODE is a code assigned to expenses, revenue and membership and
  #     enables expenses and revenue to be categorized into meaningful report groupings.
  #     This categorization allows analysis of similar buckets of information to be
  #     grouped together in order to understand trends and generate reporting needs.
  #   expr: HCC_CMRCL_MNGMNT_LOW_SHRT_DESC
  #   data_type: string
  #   synonyms:
  #   - hcc_low_desc
  #   - health_category_low
  #   sample_values:
  #   - IP BH
  #   - IP Med/Surg
  #   - IP NICU
  #   - IP OB Dlvry
  #   - IPAC - Well NB
  #   - NF
  - name: rendering_provider_name
    description: Rendering Provider Name.
    expr: RNDRG_PROV_NM
    data_type: string
    synonyms:
    - provider_name
    - provider
  - name: rendering_hospital_system
    description: Hospital Name who the Rendering Provider is a part of.
    expr: RNDRG_HOSP_SYS_NM
    data_type: string
    synonyms:
    - hospital_system
    - hospital
  - name: facility_type
    description: PLACE OF SERVICE NAME is the name for the individual code value
    expr: FCLTY_TYPE
    data_type: string
    synonyms:
    - facility
    sample_values:
    - ACUTE HOSPITAL
    - ACUTE PSYCH
    - ADULT DAY CARE
    - ALTERNATE BIRTH CENTER
    - AMBULATORY SURGERY CENTER
    - CHEMICAL DEPENDENCY REHAB
    - CHILDRENS
    - CHRISTIAN SCIENCE
    - COMMUNITY MENTAL HEALTH CENTER
    - COMPREHENSIVE OUTPATIENT REHAB FACILITIES
    - CRITICAL ACCESS
    - DIALYSIS
    - FEDERAL QUALIFIED HEALTH CENTER
    - FREESTANDING CLINIC/CENTER
    - FREESTANDING ER/URGENT CARE
    - HOME HEALTH - FREESTANDING
    - HOME HEALTH - HOSPITAL-BASED
    - HOME INFUSION THERAPY
    - HOSPICE
    - HOSPITAL BASED ASC
    - HOSPITAL-BASED HEALTH CLINIC
    - INDEPENDENT LAB
    - INTERMEDIATE CARE FACILITY
    - Invalid
    - LONG TERM CARE HOSPITAL
    - MILITARY HOSPITAL
    - NON RESIDENTIAL
    - NON-MED CRT REHAB
    - NURSING HOME
    - Not Mapped
    - OTHER
    - PSYCH HEALTH FACILITY
    - PSYCH SUBPROVIDER
    - Physical Rehab
    - RESIDENTIAL TREATMENT CTR
    - RESIDENTIAL TREATMENT FACILITY
    - RURAL HEALTH CLINIC - FREESTANDING
    - RURAL HEALTH CLINIC - HOSPITAL-BASED
    - SNF - FREE STANDING
    - SNF - HOSPITAL BASED
    - TRANSITIONAL CARE
    - VETERAN HOSPITAL
  - name: drg_code
    description: DIAGNOSIS RELATED GROUP (DRG) CODE represents the specific 'Diagnosis
      Related Group' (DRG) associated with a Claim. A DRG is a national coding scheme
      which classifies an inpatient stay based on diagnosis, procedure, discharge
      status, age and sex.
    expr: FNL_DRG_CD
    data_type: string
    synonyms:
    - drg
  - name: drg_name
    description: DIAGNOSIS RELATED GROUP NAME is the name for the individual code
      value. DIAGNOSIS RELATED GROUP (DRG) CODE represents the specific 'Diagnosis
      Related Group' (DRG) associated with a Claim. A DRG is a national coding scheme
      which classifies an inpatient stay based on diagnosis, procedure, discharge
      status, age and sex.
    expr: FNL_DRG_NM
    data_type: string
    synonyms:
    - drg_description
  - name: procedure_code
    description: 'PROCEDURE CODE is a code that defines a service that a Provider
      may deliver. It includes procedures and or other treatments (e.g., Durable Medical
      Equipment (DME) & supplies as well as diagnostic tests). Procedure codes are
      represented as ADA/CDT, CPT, HCPCS, ICD etc. Note: SSP uses both local and national
      codes. These codes are related to services such as lobotomy, office visit, throat
      culture, x-ray, room and board.'
    expr: PROC_CD
    data_type: string
    synonyms:
    - proc_code
    - cpt
  - name: procedure_name
    description: 'PROCEDURE SHORT DESCRIPTION is the short description text for the
      individual code value. PROCEDURE CODE is a code that defines a service that
      a Provider may deliver. It includes procedures and or other treatments (e.g.,
      Durable Medical Equipment (DME) & supplies as well as diagnostic tests). Procedure
      codes are represented as ADA/CDT, CPT, HCPCS, ICD etc. Note: SSP uses both local
      and national codes. These codes are related to services such as lobotomy, office
      visit, throat culture, x-ray, room and board.'
    expr: PROC_SHRT_NM
    data_type: string
    synonyms:
    - proc_name
    - procedure_description
    - cpt
  - name: product_code
    description: PRODUCT CODE is a unique code that represents the Products, which
      aggregates sub products into a product level.
    expr: PROD_CD
    data_type: string
    synonyms:
    - product
    sample_values:
    - PM0010
    - PM0024
    - PM0026
    - PM0027
    - PM0036
    - PM0038
    - PM0039
    - PM0068
    - PM0074
    - PM0075
    - PM0078
    - PM0079
    - PM0084
    - PM0172
    - PM0173
    - PM0176
    - PM0198
    - PM0207
    - PM0208
    - PM0210
    - PM0211
    - PM0218
    - PM0330
    - PM0333
    - PM0334
    - PM0335
    - PM0400
    - PM0401
    - PM3561
    - PM4559
  - name: product_description
    description: 'PRODUCT SHORT DESCRIPTION of PRODUCT CODE is a unique code that
      represents the Products, which aggregates sub products into a product level.
      Examples: Medical, FGS Medical, ABD Dual Enrolled, PPO Medicare HMO, AD&D.'
    expr: PROD_SHRT_DESC
    data_type: string
    synonyms:
    - product_desc
    sample_values:
    - ABD Dual Eligible
    - ABD Non Dual
    - CHIP Perinate
    - CHIP Standard
    - CSNP HMO
    - CSNP PPO
    - Commercial Behavioral Health
    - Commercial Med Supp
    - DSNP HMO
    - DSNP PPO
    - EPO
    - FFS
    - Family Care
    - HMO
    - ISNP
    - LTSS Dual Eligible
    - LTSS Dual Enrolled
    - LTSS Non Dual
    - MMP Community Well
    - MMP Nursing Facility
    - MMP Waiver
    - Medicare HMO
    - POS
    - PPO
    - PPO Local
    - PPO Regional
    - SNP
    - SNP Crossover
    - TANF Foster Care
    - TANF Standard
  - name: primary_diagnosis_code
    description: DIAGNOSIS CODE represents an ICD CM Diagnosis Code identifying a
      condition being treated.
    expr: PRMRY_DSCHRG_DIAG_CD
    data_type: string
    synonyms:
    - diagnosis_code
    - diag_code
    - icd_code
  - name: primary_diagnosis_name
    description: DIAGNOSIS SHORT NAME is the name for the individual code value which
      represents an ICD CM Diagnosis Code identifying a condition being treated.
    expr: PRMRY_DSCHRG_DIAG_NM
    data_type: string
    synonyms:
    - diagnosis_name
    - diag_name
  - name: pa_required_code
    description: PRIOR AUTHORIZATION REQUIRED CODE is an indicator that a prior authorization
      was required for the drug prescribed. Anything > 0 is considered required.
    expr: PA_RQRD_CD
    data_type: string
    synonyms:
    - pa_required
    - auth_required
    sample_values:
    - '-1'
    - '-2'
    - '-3'
    - N
    - Y
    is_enum: true
  - name: claim_number
    description: CLAIM NUMBER is a unique number assigned to a claim, which is assigned
      internally by Anthem systems. Often referred to as the Document Control Number
      or 'DCN'.
    expr: CLM_NBR
    data_type: string
    synonyms:
    - dcn
    - claim_id
  time_dimensions:
  - name: snap_month
    description: SNAP YEAR MONTH NUMBER reflects the YYYYMM of the month end for which
      the data is produced. This should not be used for rolling windows.
    expr: SNAP_YEAR_MNTH_NBR
    data_type: number
    synonyms:
    - snap_date
    - snapshot_month
  - name: incurred_month
    description: It is the four digit Julian year and two digit month of the Analytic
      Incurred Date. Analytic Incurred Date represents the start of the service for
      an admit or visit.
    expr: ANLYTC_INCRD_YEAR_MNTH_NBR
    data_type: number
    synonyms:
    - incurred_date
    - service_month
  facts:
  - name: member_account_key
    description: ENTERPRISE DIMENSIONAL MODEL MEMBER ACCOUNT KEY represents a surrogate
      identifier assigned to a Member Account table record.
    expr: EDM_MBR_ACCT_KEY
    data_type: number
    synonyms:
    - member_key
    - member_id
  - name: authorization_key
    description: Indicates if claim has any authorization request, null - no authorization
      request, anything > 0 is auth request.
    expr: EDM_AUTHRZN_KEY
    data_type: number
    synonyms:
    - auth_key
  - name: approved_auth_key
    description: Indicates if the authorization was approved, null - auth request
      denied and anything > 0 is approved.
    expr: APPROVED_AUTH_KEY
    data_type: number
    synonyms:
    - approved_auth
  - name: admit_count
    description: It represents a count of derived admits. For each unique Admit based
      on a unique Member Account Key, Rendering Provider Account Key, and consecutive
      days or overlapping days, count 1 admit.
    expr: ADMIT_CNT
    data_type: number
    synonyms:
    - admissions
    - admit
  - name: paid_amount
    description: It represents the Paid Amount plus Recovery Amount (Recovery amount
      is populated from source as a negative amount) not to go below zero (since this
      business rule is adding a negative number to Paid Amount).
    expr: ANLYTC_PAID_AMT
    data_type: number
    synonyms:
    - paid
    - paid_amt
  - name: allowed_amount
    description: It is the contracted reimbursable amount for covered medical services
      or supplies or amount reflecting local methodology for non-contracted providers
      plus the New York State Surcharge amount, beginning with the load of the May,
      2016 data (SNAP_YEAR_MNTH_NBR = 201605). For data prior to May, 2016, ANALYTIC
      ALLOWED AMOUNT is the contracted reimbursable amount for covered medical services
      or supplies or amount reflecting local methodology for non-contracted providers.
    expr: ANLYTC_ALWD_AMT
    data_type: number
    synonyms:
    - allowed
    - allowed_amt
  - name: billed_charge_amount
    description: BILLED CHARGE AMOUNT is the amount submitted by the provider for
      reimbursement of health care services. This amount may also include non-covered
      services.
    expr: BILLD_CHRG_AMT
    data_type: number
    synonyms:
    - billed
    - charges
  metrics:
  - name: claims_expense.paid_ratio
    description: Ratio of paid to allowed amount
    expr: SUM({claims_expense.paid_amount}) / NULLIF(SUM({claims_expense.allowed_amount}),
      0)
  - name: claims_expense.avg_allowed_per_admit
    description: Average allowed amount per admission
    expr: SUM({claims_expense.allowed_amount}) / NULLIF(SUM({claims_expense.admit_count}),
      0)
  - name: claims_expense.avg_paid_per_admit
    description: Average paid amount per admission
    expr: SUM({claims_expense.paid_amount}) / NULLIF(SUM({claims_expense.admit_count}),
      0)
  - name: claims_expense.auth_rate
    description: Authorization rate (claims with auth / total claims)
    expr: SUM(CASE WHEN {claims_expense.authorization_key} IS NOT NULL THEN 1 ELSE
      0 END) / NULLIF(COUNT(*), 0)
  - name: claims_expense.auth_approval_rate
    description: Authorization approval rate (approved / requested)
    expr: SUM(CASE WHEN {claims_expense.approved_auth_key} IS NOT NULL THEN 1 ELSE
      0 END) / NULLIF(SUM(CASE WHEN {claims_expense.authorization_key} IS NOT NULL
      THEN 1 ELSE 0 END), 0)
  - name: claims_expense.total_allowed
    description: Total allowed amount
    expr: SUM({claims_expense.allowed_amount})
  - name: claims_expense.total_paid
    description: Total paid amount
    expr: SUM({claims_expense.paid_amount})
  - name: claims_expense.total_admissions
    description: Total admission count
    expr: SUM({claims_expense.admit_count})
  - name: claims_expense.claim_count
    description: Total count of claims
    expr: COUNT(DISTINCT {claims_expense.claim_number})
  - name: claims_expense.avg_billed_per_claim
    description: Average billed charge per claim
    expr: SUM({claims_expense.billed_charge_amount}) / NULLIF(COUNT(DISTINCT {claims_expense.claim_number}),
      0})
