name: pi_wgs_mad_view
description: PI WGS MAD semantic view over Timber-eligible WGS claim lines for cost,
  payment, and authorization analysis
comments: 'This semantic view exposes the WGS MAD claim line table for multi-dimensional
  analysis:

  - Claim line financial dimensions and amounts (billed, allowed, paid, deductible,
  copay, coinsurance)

  - Provider, member, product, funding, and network dimensions

  - Diagnosis, procedure, revenue, and UM dimensions

  - Standard Timber filter is required for production reporting (tmb_edit_ind = ''Y'')

  '
tables:
- name: wgs_mad
  description: WGS MAD claim line data for cost, payment, network, and authorization
    analysis
  base_table:
    database: NON_CRTFD_AIFS
    schema: DL_PL_TMBR
    table: GENAI_PIAD_MAD_WGS_FNCL_MBU
  dimensions:
  - name: claim_nbr
    description: Claim nbr - each claim nbr can have one or many claim line numbers.
    expr: gnchiios_hclm_dcn
    data_type: string
    synonyms:
    - nbr
  - name: claim_line_nbr
    description: Claim Line Number
    expr: ddc_dtl_lne_nbr
    data_type: number
    synonyms:
    - nbr
  - name: claim_sequence_nbr
    description: Last status of the claim (decending sequence starting at 999, lowest
      number is the latest version of the claim)
    expr: gnchiios_hclm_seq_nbr
    data_type: number
    synonyms:
    - sequence
  - name: claim_adjustment_key
    description: CLAIM ADJUSTMENT KEY is a surrogate identifier, which uniquely identifies
      an Enterprise Data Warehouse Claim record.
    expr: CLM_ADJSTMNT_KEY
    data_type: number
    synonyms:
    - adjustment_key
  - name: pro_rated_ind
    description: This is 'Y' if the line is pro-rated as part of a summary claim,
      'N' if it is not.
    expr: CLM_ADJDCTN_LVL_CD
    data_type: string
    synonyms:
    - pro_rated
    is_enum: true
    sample_values:
    - N
    - U
    - Y
  - name: claim_type
    description: 'Claim Type: if user asks for CMS-1500 or professional claim, use
      ddc_cd_clm_type in (''MA'', ''MM'', ''PA'', ''PM'', ''PC''); if user ask for
      UB-04 or outpatient or facility claim, use ddc_cd_clm_type like ''O%''; only
      when user specifically asks for inpatient claim use ddc_cd_clm_type like ''I%''.'
    expr: ddc_cd_clm_type
    data_type: string
    synonyms:
    - type
    sample_values:
    - IA
    - IC
    - MA
    - MM
    - OA
    - OC
    - PA
    - PM
    - SA
    - SC
  - name: line_of_business_desc
    description: line of business description
    expr: LOB_DESC
    data_type: string
    synonyms:
    - line_of_business
    is_enum: true
    sample_values:
    - Commercial
    - DENTAL & VISION
    - GBD GRS
    - GBD Medicaid
    - GBD Medicare
    - Medicare Supplement
    - Others
  - name: funding_type
    description: 'funding type: If user looks for FINR or full insured non refunding
      , please use funding=''Non-Refunding''; if user looks for ASO, please use funding=''ASO'''
    expr: funding
    data_type: string
    is_enum: true
    sample_values:
    - ASO
    - Non-Refunding
    - Refunding
    - other
  - name: health_service_code
    description: also refers to procedure code, cpt code. CPT will always be 5 digits
      format. If not, pad with leading 0. (e.g. 1234 should be 01234 )
    expr: HLTH_SRVC_CD
    data_type: string
    synonyms:
    - health_service
  - name: procedure_modifier_code_1
    description: Procedure Modifier 1 Code. Modifier will always be 2 digits numbers
      or 2 upper case letters, or a combination of 1 uppercase letter with 1 digits.
      (e.g. LT, G0)
    expr: PROC_MDFR_1_CD
    data_type: string
    synonyms:
    - procedure_modifier_1
  - name: procedure_modifier_code_2
    description: Procedure Modifier 2 Code. Modifier will always be 2 digits numbers
      or 2 upper case letters, or a combination of 1 uppercase letter with 1 digits.
      (e.g. LT, G0)
    expr: PROC_MDFR_2_CD
    data_type: string
    synonyms:
    - procedure_modifier_2
  - name: procedure_modifier_code_3
    description: Procedure Modifier 3 Code. Modifier will always be 2 digits numbers
      or 2 upper case letters, or a combination of 1 uppercase letter with 1 digits.
      (e.g. LT, G0)
    expr: PROC_MDFR_3_CD
    data_type: string
    synonyms:
    - procedure_modifier_3
  - name: procedure_modifier_code_4
    description: Procedure Modifier 4 Code. Modifier will always be 2 digits numbers
      or 2 upper case letters, or a combination of 1 uppercase letter with 1 digits.
      (e.g. LT, G0)
    expr: PROC_MDFR_4_CD
    data_type: string
    synonyms:
    - procedure_modifier_4
  - name: place_of_service_code
    description: Place of Service Code. Place of service code will always be 2 digits
      format. If not, pad with leading 0. (e.g. 9 should be 09 )
    expr: ddc_dtl_hcfa_pt_cde
    data_type: string
    synonyms:
    - place_of_service
  - name: claim_line_status_code
    description: 'CLAIM LINE STATUS CODE is a code which defines the current status
      of a Claim Line. Examples are: APRVD Approved (only adjudicated claim have this
      status) DND Denied (only adjudicated claims have this status) PND Pending Adjudication
      UNKWN Unknown'
    expr: CLM_LINE_STTS_CD
    data_type: string
    synonyms:
    - status
    is_enum: true
    sample_values:
    - APRVD
    - DND
  - name: claim_line_revenue_code
    description: 'Revenue code: should always have 4 digits. If see 3 or less digits,
      please pad with leading 0. (e.g. 450 should be 0450 )'
    expr: RVNU_CD
    data_type: string
    synonyms:
    - revenue
  - name: provider_pricing_state_zip
    description: Provider Pricing State
    expr: ddc_cd_pricng_zip_state
    data_type: string
  - name: participation_status_code
    description: 'PARTICIPATION STATUS CODE: indicates the type of agreement the Provider
      has with the Plan for a specified Line Of Business (LOB).'
    expr: PARG_STTS_CD
    data_type: string
    synonyms:
    - participation_status
    sample_values:
    - '01'
    - '02'
    - UNK
  - name: in_network_code
    description: 'IN NETWORK CODE: is a code which represents whether services were
      performed by a provider that is in network for the member’s plan on that date
      of service. For example: IN - In Network - Indicates that the provider is considered
      In Network for member’s plan on the service date of the claim. OUT - Out of
      Network - Indicates that the provider is considered Out of Network or Non-Participating
      for member’s plan on the service date of the claim.'
    expr: INN_CD
    data_type: string
    synonyms:
    - in_network
    is_enum: true
    sample_values:
    - IN
    - OUT
  - name: provider_name
    description: provider name
    expr: PROV_NAME
    data_type: string
  - name: rendering_provider_npi_id
    description: 'Rendering Provider NPI ID: providers who serviced or rendered the
      claim'
    expr: RNDRG_PROV_NPI_ID
    data_type: string
    synonyms:
    - rendering_provider_npi
  - name: billing_provider_npi_id
    description: 'Billing Provider NPI ID: providers who submitted or billed the claim'
    expr: BILLG_PROV_NPI_ID
    data_type: string
    synonyms:
    - billing_provider_npi
  - name: billing_provider_tax_id
    description: Billing Provider Tax Id, TIN (Tax Identification Number)
    expr: ddc_cd_prvdr_tax_id
    data_type: string
    synonyms:
    - billing_provider_tax
  - name: rendering_provider_taxonomy_code
    description: Rendering Provider Taxonomy Code
    expr: RNDRG_PROV_TXNMY_CD
    data_type: string
    synonyms:
    - rendering_provider_taxonomy
  - name: rendering_provider_taxonomy_description
    description: Rendering Provider Taxonomy Description
    expr: rndrg_npi_txnmy_desc
    data_type: string
    synonyms:
    - rendering_provider_taxonomy
  - name: billing_provider_taxonomy_code
    description: Billing Provider Taxonomy Code
    expr: BILLG_PROV_TXNMY_CD
    data_type: string
    synonyms:
    - billing_provider_taxonomy
  - name: billing_provider_taxonomy_description
    description: Billing Provider Taxonomy Description
    expr: billg_npi_txnmy_desc
    data_type: string
    synonyms:
    - billing_provider_taxonomy
  - name: provider_speciality_code
    description: Provider Specialty Code
    expr: ddc_cd_prvdr_spclty_cde
    data_type: string
    synonyms:
    - provider_speciality
  - name: provider_speciality_code_description
    description: Provider Specialty Code Description
    expr: PROV_SPCLTY_CD_DESC
    data_type: string
    synonyms:
    - provider_speciality
  - name: header_diagnosis_code_1
    description: Diagnosis Code 1 [a.k.a. Primary header level Dx Code], claim header
      level
    expr: ddc_cd_icda_cde_1
    data_type: string
    synonyms:
    - header_diagnosis_1
  - name: header_diagnosis_code_2
    description: Diagnosis Code 2,claim header level
    expr: ddc_cd_icda_cde_2
    data_type: string
    synonyms:
    - header_diagnosis_2
  - name: header_diagnosis_code_3
    description: Diagnosis Code 3,claim header level
    expr: ddc_cd_icda_cde_3
    data_type: string
    synonyms:
    - header_diagnosis_3
  - name: header_diagnosis_code_4
    description: Diagnosis Code 4,claim header level
    expr: ddc_cd_icda_cde_4
    data_type: string
    synonyms:
    - header_diagnosis_4
  - name: header_diagnosis_code_5
    description: Diagnosis Code 5,claim header level
    expr: ddc_cd_icda_cde_5
    data_type: string
    synonyms:
    - header_diagnosis_5
  - name: header_diagnosis_code_other_1
    description: Diagnosis Code Other 1,claim header level
    expr: ddc_cd_icda_cde_oth_1
    data_type: string
    synonyms:
    - header_diagnosis_other_1
  - name: header_diagnosis_code_other_2
    description: Diagnosis Code Other 2,claim header level
    expr: ddc_cd_icda_cde_oth_2
    data_type: string
    synonyms:
    - header_diagnosis_other_2
  - name: header_diagnosis_code_other_3
    description: Diagnosis Code Other 3,claim header level
    expr: ddc_cd_icda_cde_oth_3
    data_type: string
    synonyms:
    - header_diagnosis_other_3
  - name: header_diagnosis_code_other_4
    description: Diagnosis Code Other 4,claim header level
    expr: ddc_cd_icda_cde_oth_4
    data_type: string
    synonyms:
    - header_diagnosis_other_4
  - name: header_diagnosis_code_other_5
    description: Diagnosis Code Other 5,claim header level
    expr: ddc_cd_icda_cde_oth_5
    data_type: string
    synonyms:
    - header_diagnosis_other_5
  - name: header_diagnosis_code_other_6
    description: Diagnosis Code Other 6,claim header level
    expr: ddc_cd_icda_cde_oth_6
    data_type: string
    synonyms:
    - header_diagnosis_other_6
  - name: header_diagnosis_code_other_7
    description: Diagnosis Code Other 7,claim header level
    expr: ddc_cd_icda_cde_oth_7
    data_type: string
    synonyms:
    - header_diagnosis_other_7
  - name: member_age
    description: 'member age: member age in years as of service date'
    expr: ddc_cd_pat_age
    data_type: number
  - name: member_gender
    description: Member Gender Code
    expr: ddc_cd_pat_sex
    data_type: string
    is_enum: true
    sample_values:
    - ''
    - F
    - M
    - U
  - name: member_id
    description: Member Identifier
    expr: LOB_MBR_ID
    data_type: string
    synonyms:
    - member
  - name: member_subscriber_id
    description: Subscriber ID (is tokenized)
    expr: SRC_SBSCRBR_ID
    data_type: string
    synonyms:
    - member_subscriber
  - name: claim_its_host_code
    description: Claim ITS Host Code (Inter-plan Teleprocessing System Host Code)
    expr: CLM_ITS_CD
    data_type: string
    synonyms:
    - its_host
    is_enum: true
    sample_values:
    - HOME
    - HOST
    - OTHR
  - name: claim_line_encounter_id
    description: Claim Line Encounter Id
    expr: CLM_LINE_ENCNTR_CD
    data_type: string
    synonyms:
    - encounter
    sample_values:
    - G
    - N
    - O
    - Y
  - name: claim_edit_code
    description: 'SOURCE CLAIM EDIT CODE: provides the additional information required
      for next steps for the claim processor.'
    expr: SRC_CLM_EDIT_CD
    data_type: string
    synonyms:
    - edit
  - name: source_claim_adjustment_reason_code
    description: 'SOURCE ADJUSTMENT REASON CODE: Always contains Spaces on Payment
      and MSA Deposit or Recovery Records, FORMAT: 99. This value is unaltered as
      received by the sending system of record.'
    expr: SRC_ADJSTMNT_RSN_CD
    data_type: string
    synonyms:
    - source_adjustment_reason
  - name: explanation_of_benefits_code
    description: EXPLANATION OF BENEFITS (EOB) CODE represents codes that will drive
      narrative to appear on the member's Explanation of Benefits Paid statement.
    expr: EOB_CDE
    data_type: string
    synonyms:
    - explanation_of_benefits
  - name: type_of_bill_code
    description: 'Type of Bill Code: 3 digit alphanumeric code found on facility claims'
    expr: ddc_hosp_type_of_bill
    data_type: string
    synonyms:
    - type_of_bill
  - name: frequency_of_the_bill_code
    description: FREQUENCY OF THE BILL CODE is a code which represents the third digit
      of the Type of Bill Code.
    expr: FRQNCY_OF_THE_BILL_CD
    data_type: string
    synonyms:
    - frequency_of_the_bill
    is_enum: true
  - name: marketing_business_unit_level_1_description
    description: MARKETING BUSINESS UNIT LEVEL 1 DESCRIPTION reflects the highest
      level of hierarchy representing the customer segments and sizes.
    expr: mbu_lvl_1_desc
    data_type: string
    synonyms:
    - marketing_business_unit_level_1
  - name: marketing_business_unit_chartfield_code
    description: MARKETING BUSINESS UNIT CHARTFIELD CODE is a code which represents
      how products are marketed at WellPoint.
    expr: MARKET
    data_type: string
    synonyms:
    - marketing_business_unit_chartfield
  - name: rendering_state
    description: Rendering provider State or rendering state
    expr: ddc_nat_ea3_rend_state
    data_type: string
  - name: brand_description
    description: BRAND DESCRIPTION describes the branding or marketing strategy of
      the business.
    expr: brnd_desc
    data_type: string
    synonyms:
    - brand
  - name: tmb_edit_ind
    description: 'Timber eligible indicator: identify if claims are Timber eligible'
    expr: EDIT_TMB_IND
    data_type: string
    synonyms:
    - tmb_edit
    is_enum: true
    sample_values:
    - N
    - Y
  - name: claim_line_reimburse_method_code
    description: CLAIM LINE REIMBURSE METHOD CODE indicates what compensation process
      used for pricing independent of any discount actually realized.
    expr: CLM_LINE_REIMB_MTHD_CD
    data_type: string
    synonyms:
    - reimburse_method
  - name: src_pricing_reason_codes
    description: 'PRICING REASON CODE: a code from corporate systems that indicates
      action taken by corporate pricing, as it appears in the system of record.'
    expr: ddc_dtl_pricng_rsn_cde
    data_type: string
    synonyms:
    - src_pricing_reasons
  - name: line_diagnosis_code_1
    description: Primary line level Dx code, or line level diagnosis code 1
    expr: LINE_DIAG1
    data_type: string
    synonyms:
    - line_diagnosis_1
  - name: line_diagnosis_code_2
    description: line level diagnosis code 2
    expr: LINE_DIAG2
    data_type: string
    synonyms:
    - line_diagnosis_2
  - name: line_diagnosis_code_3
    description: line level diagnosis code 3
    expr: LINE_DIAG3
    data_type: string
    synonyms:
    - line_diagnosis_3
  - name: line_diagnosis_code_4
    description: line level diagnosis code 4
    expr: LINE_DIAG4
    data_type: string
    synonyms:
    - line_diagnosis_4
  - name: line_diagnosis_code_5
    description: line level diagnosis code 5
    expr: LINE_DIAG5
    data_type: string
    synonyms:
    - line_diagnosis_5
  - name: provider_contract_id
    description: PROVIDER CONTRACT IDENTIFIER is an identifier for a defined reimbursement
      schedule for a given service rendered by a Provider Organization.This includes
      professional Fee Schedule Identifiers as well as facility Contract Identifiers
    expr: PN_ID
    data_type: string
    synonyms:
    - provider_contract
  - name: provider_contract_code_variance
    description: 'Provider contract code variance : this is last portion of provider
      contract identifier'
    expr: ddc_dtl_prvdr_contr_varn
    data_type: string
    synonyms:
    - provider_contract_variance
  - name: fee_schedule_id
    description: 'FEE SCHEDULE IDENTIFIER: an identifier for a defined reimbursement
      schedule for a given service rendered by a Provider Organization'
    expr: FEE_SCHED_ID
    data_type: string
    synonyms:
    - fee_schedule
  - name: negotiated_service_term_code
    description: Negotiated Service Term Code
    expr: ddc_dtl_nst_cde
    data_type: string
    synonyms:
    - negotiated_service_term
  - name: institutional_reimbursement_term_code
    description: Intstitutional Reimbursement Term Code
    expr: ddc_dtl_irf_cde
    data_type: string
    synonyms:
    - institutional_reimbursement_term
  - name: provider_contract_code
    description: Provider contract code (first portion of PN_ID)
    expr: ddc_dtl_prvdr_contr_cde
    data_type: string
    synonyms:
    - provider_contract
  - name: reason_for_visit_diagnosis_code_1
    description: reason_for_visit_code_1
    expr: ddc_cd_pat_rsn_vst_1
    data_type: string
    synonyms:
    - reason_for_visit_diagnosis_1
  - name: member_provider_network_id
    description: Member Provider Network Id
    expr: NTWK_ID
    data_type: string
    synonyms:
    - member_provider_network
  - name: group_id
    description: Group ID or number
    expr: SRC_GRP_NBR
    data_type: string
    synonyms:
    - group
  - name: product_chartfield_code
    description: 'PRODUCT CHARTFIELD CODE: High Level Description of Product'
    expr: PROD_CF_CD
    data_type: string
    synonyms:
    - product_chartfield
  - name: primary_carrier_responsible_code
    description: To identify who has the primary carrier responsibility
    expr: PRMRY_CARR_RSPNSBLY_CD
    data_type: string
    synonyms:
    - primary_carrier_responsible
    is_enum: true
    sample_values:
    - MDCR
    - OTHIN
    - WLP
  - name: who_paid_as_prime
    description: 'Who Paid as Prime at Line Level: if user is looking for Anthem is
      the Primary Payer, use WHO_PAID_AS_PRIME=''ANTM'''
    expr: WHO_PAID_AS_PRIME
    data_type: string
    is_enum: true
    sample_values:
    - ANTM
    - OTHER
  - name: benefit_payment_status_code
    description: 'BENEFIT PAYMENT STATUS CODE: a code which indicates the in network
      or out of network payment status of the claim. This reflects how the claim was
      paid. For example: Y – In Network – The benefit payment status code is in network.
      N – Out of Network - The benefit payment status code is out of network. O –
      Non Network Other – The benefit payment status code is out of network.'
    expr: BNFT_PAYMNT_STTS_CD
    data_type: string
    synonyms:
    - benefit_payment_status
    is_enum: true
    sample_values:
    - N
    - Y
  - name: membership_product_code
    description: 'Membership Source System Product Identifier or PRODUCT IDENTIFIER:
      uniquely identifies an offering provided by WellPoint to any interested Party.'
    expr: ddc_dtl_mbr_prdt_cde
    data_type: string
    synonyms:
    - membership_product
  - name: national_drug_code_ndc
    description: NDC (national drug code) number of corresponding drugs/biological
    expr: ddc_nat_e00_ndc_code
    data_type: string
    synonyms:
    - national_drug_ndc
  - name: unit_of_measure
    description: 'unit_of_measure, identify the unit of measure for the package size
      of the solid, liquid, or gas, as dispensed. Examples: UN = Unit; ML = Milliliter,
      ME = Milligram'
    expr: ddc_nat_g00_ndc_units_qual
    data_type: string
  - name: benefit_package_id
    description: BENEFIT PACKAGE IDENTIFIER is the Plan identifier for the specific
      benefit package.
    expr: BNFT_PKG_ID
    data_type: number
    synonyms:
    - benefit_package
  - name: auto_or_manual
    description: 'auto or manual: indicate if a claim is auto or manually adjudicated'
    expr: AUTO_OR_MANL
    data_type: string
    is_enum: true
    sample_values:
    - Auto
    - Manual
  - name: claim_bypass_code
    description: 'claim_bypass_code: Concatenation of 5 BYPASS codes. These bypass
      codes are used to bypass certain errors in image processing.'
    expr: CLM_BYPASS_CDE
    data_type: string
    synonyms:
    - bypass
  - name: price_error
    description: price_error
    expr: DDC_DTL_PRICE_ERR
    data_type: string
  - name: writeoff_reason_type_code
    description: writeoff_reason_type_code
    expr: DDC_DTL_WRITEOFF_TYPE_CDE
    data_type: string
    synonyms:
    - writeoff_reason_type
  - name: deduct_reason_type_code
    description: deduct_reason_type_code
    expr: DDC_DTL_DEDUCT_TYPE_CDE
    data_type: string
    synonyms:
    - deduct_reason_type
  - name: other_reason_type_code
    description: other_reason_type_code
    expr: DDC_DTL_OTH_TYPE_CDE
    data_type: string
    synonyms:
    - other_reason_type
  - name: copay_reason_type_code
    description: copay_reason_type_code
    expr: DDC_DTL_COPAY_TYPE_CDE
    data_type: string
    synonyms:
    - copay_reason_type
  - name: reject_reason_type_code
    description: reject_reason_type_code
    expr: DDC_DTL_REJ_TYPE_CDE
    data_type: string
    synonyms:
    - reject_reason_type
  - name: proc_service_class_cd_1
    description: procedure service class code (1) - code assigned to health procedure
      codes that classifies similar services
    expr: ddc_dtl_proc_svc_cls_1
    data_type: string
  - name: proc_service_class_cd_2
    description: procedure service class code (2) - code assigned to health procedure
      codes that classifies similar services
    expr: ddc_dtl_proc_svc_cls_2
    data_type: string
  - name: proc_service_class_cd_3
    description: procedure service class code (3) - code assigned to health procedure
      codes that classifies similar services
    expr: ddc_dtl_proc_svc_cls_3
    data_type: string
  - name: hospital_medicare_id
    description: Hospital's Medicare Id
    expr: SRC_MEDCR_ID
    data_type: string
    synonyms:
    - hospital_medicare
  - name: product_lvl2_description
    description: PRODUCT LEVEL 2 DESCRIPTION reflects the second highest level of
      hierarchy representing the company product offerings.
    expr: prod_lvl_2_desc
    data_type: string
    synonyms:
    - product_lvl2
    sample_values:
    - ACCIDENT
    - CRITICAL ILLNESS
    - FFS
    - HMO
    - HOSPITAL INDEMNITY
    - MEDICAID
    - OTHER
    - POS
    - PPO
  - name: icd_pcs_1
    description: ICD PCS 1 for Inpatient Claim
    expr: ddc_hosp_icd_prcdr_cde_1
    data_type: string
  - name: icd_pcs_2
    description: ICD PCS 2 for Inpatient Claim
    expr: ddc_hosp_icd_prcdr_cde_2
    data_type: string
  - name: icd_pcs_3
    description: ICD PCS 3 for Inpatient Claim
    expr: ddc_hosp_icd_prcdr_cde_3
    data_type: string
  - name: icd_pcs_4
    description: ICD PCS 4 for Inpatient Claim
    expr: ddc_hosp_icd_prcdr_cde_4
