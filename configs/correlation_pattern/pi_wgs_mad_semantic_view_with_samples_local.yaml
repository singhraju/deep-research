    expr: '{wgs_mad.claim_service_start_date} >= DATEADD(month, -12, CURRENT_DATE())'
  - name: high_cost_lines
    description: Claim lines with allowed amount > $50,000
    synonyms:
    - high_cost
    - expensive_lines
    expr: '{wgs_mad.claim_line_allowed_amount} > 50000'
analysis_modes:
- name: cost_change_investigation_over_time_window
  description: 'Explains how a selected cost metric changed between two comparable
    time periods. Its purpose is to identify: 1. what metric changed, 2. how much
    it changed, 3. which dimensions contributed most to the change, 4. and which drill-down
    path best localizes the change. This mode compares a prior period and a current
    period over the same metric, under a user-defined scope. It ranks candidate dimensions
    by contribution to the metric delta and generates SQL for iterative drill-down.'
  drill_metric:
  - wgs_mad.total_paid
  explainer_metrics:
  - wgs_mad.claim_count
  - wgs_mad.claim_line_count
  - wgs_mad.avg_paid_per_claim
  - wgs_mad.paid_to_allowed_ratio
  save_parquet: false
  disable_summary_creation: true
  generate_recommendations: false
  interaction_matrix:
    enabled: true
    trigger_rules:
      interaction_stage:
        min_abs_net_delta: 1000
        min_drill_path_depth: 2
        run_when_repeated_delta_ratio: 0
        run_when_low_volume: true
      clinical_stage:
        require_selected_operational_cells: true
        min_selected_operational_positive_delta: 1000
    categories:
      operational:
        dimensions:
        - claim_type_desc
        - funding_type
        - product_lvl2_description
        - who_paid_as_prime
        - primary_carrier_responsible_code
        - marketing_business_unit_level_1_description
        - src_provider_zip_code
        carry_through_dimensions:
        - line_of_business_desc
        - provider_state_code
      clinical:
        dimensions:
        - provider_speciality_code_description
        - health_service_code
        - ndc_label_number
        - type_of_bill_code
    selection_rules:
      operational:
        min_positive_delta: 1000
        min_share_of_positive_delta: 0.05
        max_cumulative_share_of_positive_delta: 0.8
        max_k: 5
        always_include_min_share_of_net_delta: 0.4
