    expr: COUNT(DISTINCT {wgs_mad.claim_nbr})
  - name: wgs_mad.claim_line_count
    description: Total claim line count
    expr: COUNT(*)
  - name: wgs_mad.avg_paid_per_claim
    description: Average paid amount per claim
    expr: SUM({wgs_mad.claim_line_pay_amount}) / NULLIF(COUNT(DISTINCT {wgs_mad.claim_nbr}),
      0)
  - name: wgs_mad.avg_paid_per_line
    description: Average paid amount per claim line
    expr: SUM({wgs_mad.claim_line_pay_amount}) / NULLIF(COUNT(*), 0)
  - name: wgs_mad.avg_billed_per_claim
    description: Average billed amount per claim
    expr: SUM({wgs_mad.claim_line_billed_amount}) / NULLIF(COUNT(DISTINCT {wgs_mad.claim_nbr}),
      0)
  - name: wgs_mad.paid_to_allowed_ratio
    description: Ratio of paid to allowed amount
    expr: SUM({wgs_mad.claim_line_pay_amount}) / NULLIF(SUM({wgs_mad.claim_line_allowed_amount}),
      0)
  - name: wgs_mad.denial_rate
    description: Share of claim lines with denied status
    expr: SUM(CASE WHEN {wgs_mad.claim_line_status_code} = 'DND' THEN 1 ELSE 0 END)
      / NULLIF(COUNT(*), 0)
  - name: wgs_mad.approval_rate
    description: Share of claim lines with approved status
    expr: SUM(CASE WHEN {wgs_mad.claim_line_status_code} = 'APRVD' THEN 1 ELSE 0 END)
      / NULLIF(COUNT(*), 0)
