version: '1.0'
source: CoC AI Analyst Decision Tree - 03.31.2025
description: Decision tree rules for healthcare cost of care analysis
service_categories:
  IP MedSurg (DNE):
  - rule_type: trend_category
    trend_id: 1
    research_considerations: Analyst to determine Provider drivers
    why: Is variance isolated to subset of providers, limiting research to both behavior
      and contractual changes?
    flags:
      clinical: false
      network: false
      ops: false
    cost_of_care_suggestions: null
  - rule_type: detailed_rule
    parent_trend_id: 1
    research_considerations: Analyst to review Contract Provisions
    why: Is variance explainable by contract changes or concessions that limit ELV
      management?
    flags:
      clinical: false
      network: true
      ops: false
    cost_of_care_suggestions: Contract remediation opportunity?  Alternative management
      options?
  - rule_type: detailed_rule
    parent_trend_id: 1
    research_considerations: Analyst to review Provider distribution
    why: Is variance explainable by utilization increases at higher cost facilities?
    flags:
      clinical: false
      network: true
      ops: false
    cost_of_care_suggestions: Contract remediation opportunity?  Establish site of
      care opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 1
    research_considerations: Analyst to review Contract Relativity
    why: Is variance explainable by unit cost increases expected in UPTPM
    flags:
      clinical: false
      network: true
      ops: false
    cost_of_care_suggestions: Contract compliance concern?
  - rule_type: detailed_rule
    parent_trend_id: 1
    research_considerations: Analyst to review In-Network vs Out-of-Network status
    why: Is variance explainable by increased distribution of OON services?
    flags:
      clinical: false
      network: true
      ops: true
    cost_of_care_suggestions: Address root cause of OON necessity?  Is the provider
      actually OON or do we have a claims payment issue?
  - rule_type: detailed_rule
    parent_trend_id: 1
    research_considerations: Analyst to review Provider Designation (Critical Access
      Hospital vs General Acute Care)
    why: Is variance explainable by increased utilization at CAH's where we have limited
      mgmt controls?
    flags:
      clinical: false
      network: true
      ops: false
    cost_of_care_suggestions: Assess root cause of admission increases and look for
      preventive opportunities?
  - rule_type: detailed_rule
    parent_trend_id: 1
    research_considerations: Analyst to review risk designation of Provider
    why: Are we paying for claims that should be covered by a capitated arrangement?
    flags:
      clinical: false
      network: true
      ops: false
    cost_of_care_suggestions: Recover dollars for which risk entity is liable?
  - rule_type: detailed_rule
    parent_trend_id: 1
    research_considerations: Analyst to review for provider unit cost outliers, both
      in cost and length of stay
    why: Is variance explainable by a subset of providers with an outlier cost/unit?
    flags:
      clinical: false
      network: true
      ops: false
    cost_of_care_suggestions: Contract remediation opportunity?  Establish site of
      care opportunity?
  - rule_type: trend_category
    trend_id: 2
    research_considerations: Analyst to determine Member drivers
    why: Is variance isolated to subset of members, limiting research to clinical
      engagement needs?
    flags:
      clinical: false
      network: false
      ops: false
    cost_of_care_suggestions: null
  - rule_type: detailed_rule
    parent_trend_id: 2
    research_considerations: Analyst to review Clinical engagement
    why: Is variance a product of poor engagement/targeting in core/local clinical
      programming?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Improve clinical engagement opportunity?  Assess new
      care navigation program?
  - rule_type: detailed_rule
    parent_trend_id: 2
    research_considerations: Analyst to review medication compliance
    why: Is variance a product of poor pharmaceutical compliance?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Establish new medication therapy management opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 2
    research_considerations: Analyst to review geolocation of member concerns
    why: Is variance a product of socio-economic conditions in that geography?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Social programming opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 2
    research_considerations: Analyst to review whole health drivers
    why: Is variance a product of co-morbidity prevalence?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Adjust clinical engagement opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 2
    research_considerations: Analyst to review PCP attribution, determining HPP/VBC
    why: Is variance a product of limited to no PCP engagement?
    flags:
      clinical: false
      network: true
      ops: false
    cost_of_care_suggestions: PCP compliance opportunity?  Adjust grading rubrik of
      value based providers?
  - rule_type: detailed_rule
    parent_trend_id: 2
    research_considerations: Analyst to review segment, sub-segment, benefit plan
      driving variance
    why: Is variance a product of mix changes or unique exposure from a specific benefit
      plan set?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: null
  - rule_type: detailed_rule
    parent_trend_id: 2
    research_considerations: Analyst to review for high utilizers
    why: Is variance driven by repeat utilization by a small subset of members
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Assess opportunity to address root cause of high utilization?
  - rule_type: detailed_rule
    parent_trend_id: 2
    research_considerations: Analyst to review the duration drivers
    why: Is variance driven by new or persistent members
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Look for adverse entry points if driven by new membership?
  - rule_type: trend_category
    trend_id: 3
    research_considerations: Analyst to determine Diagnosis drivers
    why: Is variance isolated to subset of diagnoses, limiting research to change
      in management design?
    flags:
      clinical: false
      network: false
      ops: false
    cost_of_care_suggestions: null
  - rule_type: detailed_rule
    parent_trend_id: 3
    research_considerations: Analyst to review Utilization Management ROI model
    why: Is variance a product of inconsistent clinical referrals for medical necessity
      review?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Improve nurse referral rate to MDs opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 3
    research_considerations: Analyst to review admitting diagnosis
    why: Is variance a product of prevalent presenting themes?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Assess root cause of admission increases and look for
      preventive opportunities?
  - rule_type: detailed_rule
    parent_trend_id: 3
    research_considerations: Analyst to review discharge diagnosis
    why: Is variance a product of prevalent discharge themes?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Review UM ROI model to determine P.A.V. opportunities?
  - rule_type: detailed_rule
    parent_trend_id: 3
    research_considerations: Analyst to review prevelance of Hospital Acquired Conditions
    why: Is unit cost weighting higher due to HACs?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Opportunity to recover or implement "never event" edits?
  - rule_type: trend_category
    trend_id: 4
    research_considerations: Analyst to Review Service drivers
    why: Is variance isolated to subset of services, limiting research to change in
      management design?
    flags:
      clinical: false
      network: false
      ops: false
    cost_of_care_suggestions: null
  - rule_type: detailed_rule
    parent_trend_id: 4
    research_considerations: Analyst to review level of care, i.e. acute vs sub-acute
    why: Is variance driven by acute or sub-acute levels of care?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Review initial review KPIs?  Review concurrent review
      KPIs?
  - rule_type: detailed_rule
    parent_trend_id: 4
    research_considerations: 'Analyst to review what else is being billed during stay,
      different claim (ex: ER claimed paid on same day)'
    why: Is variance driven by duplicative or inappropriate services being billed?  Is
      unbundling occuring?
    flags:
      clinical: false
      network: false
      ops: true
    cost_of_care_suggestions: Develop recurring recovery process to stem unbundling?  Develop
      a recurring edit to stem unbundling?
  - rule_type: detailed_rule
    parent_trend_id: 4
    research_considerations: 'Analyst to review what else is being billed during stay,
      same claim (ex: ER claimed paid on same day)'
    why: Is variance driven by duplicative or inappropriate services being billed?  Is
      unbundling occuring?
    flags:
      clinical: false
      network: false
      ops: true
    cost_of_care_suggestions: Develop recurring recovery process to stem unbundling?  Develop
      a recurring edit to stem unbundling?
  - rule_type: detailed_rule
    parent_trend_id: 4
    research_considerations: Analyst to review length of stay by diagnosis
    why: Is variance driven by increased length of stay that goes beyond condition
      expectations?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Opportunity to improve rounds review to determine tighter
      discharge planning?
  - rule_type: detailed_rule
    parent_trend_id: 4
    research_considerations: Analyst to review distribution of cases, DRG mix (checking
      for DRG weight implications)
    why: Is variance a product of changing episodic distribution?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Improve nurse referral rate to MDs opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 4
    research_considerations: Analyst to review severity of cases, DRG mix (APR scale
      as example)
    why: Is variance a product of DRG upcoding?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Program Integrity opportunity?
  - rule_type: trend_category
    trend_id: 5
    research_considerations: Analyst to review Readmission rate
    why: Is variance isolated to the same members, but with repeat admissions?
    flags:
      clinical: false
      network: false
      ops: false
    cost_of_care_suggestions: null
  - rule_type: detailed_rule
    parent_trend_id: 5
    research_considerations: Analyst to review various readmission types to isolate
      concern
    why: Is variance isolated to members coming back for same or similar diagnosis
      to same facility/same system?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Improve CTI discharge planning engagement opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 5
    research_considerations: Analyst to review contract protection against readmissions
    why: Is variance isolated to contract without liability protection for readmissions?
    flags:
      clinical: false
      network: true
      ops: false
    cost_of_care_suggestions: Contract remediation opportunity?
  - rule_type: trend_category
    trend_id: 6
    research_considerations: Analyst to review Potentially Avoidable Variance (PAV)
      waterfall
    why: Is variance a product of changes in utilization management KPIs?
    flags:
      clinical: false
      network: false
      ops: false
    cost_of_care_suggestions: null
  - rule_type: detailed_rule
    parent_trend_id: 6
    research_considerations: Analyst to review variance driven by services requiring
      prior auth vs no prior auth
    why: Is variance explainable by services requiring prior auth or not requiring
      prior auth?
    flags:
      clinical: true
      network: false
      ops: true
    cost_of_care_suggestions: If prior auth required, confirm prior auth obtained?
  - rule_type: detailed_rule
    parent_trend_id: 6
    research_considerations: Analyst to review lack of information denial rate
    why: Is varance a product of reduced administrative denials?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Audit auth cleanliness standards opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 6
    research_considerations: Analyst to review nurse auto-approval rate
    why: Is variance a product of approvals due to turnaround time?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Improve staffing allocation opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 6
    research_considerations: Analyst to review nurse approval rate
    why: Is variance a product of more nurse approvals?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Audit CUMG decision tree to understand why cases were
      approved?
  - rule_type: detailed_rule
    parent_trend_id: 6
    research_considerations: Analyst to review nurse denial rate
    why: Is variance a product of less nurse denials?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Audit CUMG decision tree to understand why less cases
      were denied?
  - rule_type: detailed_rule
    parent_trend_id: 6
    research_considerations: Analyst to review nurse to MD referral rate
    why: Is variance a product of less MD referrals?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Improve nurse referral rate to MDs opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 6
    research_considerations: Analyst to review MD auto-approval rate
    why: Is variance a product of approvals due to turnaround time?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Improve staffing allocation opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 6
    research_considerations: Analyst to review MD approval rate
    why: Is variance a product of more MD approvals?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Audit CUMG decision tree to understand why cases were
      approved?
  - rule_type: detailed_rule
    parent_trend_id: 6
    research_considerations: Analyst to review MD denial rate
    why: Is variance a product of less MD denials?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Audit CUMG decision tree to understand why less cases
      were denied?
  - rule_type: trend_category
    trend_id: 7
    research_considerations: Analyst to review Admission/Discharge source/location
    why: Is variance a product of more/less elective cases?
    flags:
      clinical: false
      network: false
      ops: false
    cost_of_care_suggestions: null
  - rule_type: detailed_rule
    parent_trend_id: 7
    research_considerations: Analyst to review Admission source
    why: Is variance a product of more/less elective cases?
    flags:
      clinical: true
      network: false
      ops: false
    cost_of_care_suggestions: Establish site of care opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 7
    research_considerations: Analyst to review Discharge location
