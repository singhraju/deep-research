    flags:
      clinical: false
      network: false
      ops: false
    cost_of_care_suggestions: null
  - rule_type: detailed_rule
    parent_trend_id: 8
    research_considerations: Analyst to review Auth to Claim match
    why: Are authorization denials being appropriately enforced?
    flags:
      clinical: false
      network: false
      ops: true
    cost_of_care_suggestions: Claims processing opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 8
    research_considerations: Analyst to review Auth Overrides
    why: Are authorization denials being overridden?
    flags:
      clinical: false
      network: false
      ops: true
    cost_of_care_suggestions: Claims processing opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 8
    research_considerations: Analyst to review Provider exclusions
    why: Are authorizations not required or overriden per contract?
    flags:
      clinical: false
      network: true
      ops: true
    cost_of_care_suggestions: Contract remediation opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 8
    research_considerations: Analyst to review Authorized level of care against actual
    why: Are authorizations not matching actuals?
    flags:
      clinical: false
      network: false
      ops: true
    cost_of_care_suggestions: Claims processing opportunity?
  - rule_type: trend_category
    trend_id: 9
    research_considerations: Analyst to review claim frequency/status
    why: Are claims processing/reprocessing per contractual standards?
    flags:
      clinical: false
      network: false
      ops: false
    cost_of_care_suggestions: null
  - rule_type: detailed_rule
    parent_trend_id: 9
    research_considerations: Analyst to determine volume of Interim Claims
    why: null
    flags:
      clinical: false
      network: false
      ops: true
    cost_of_care_suggestions: Have all interim claims been zeroed out in favor of
      the final bill?  Claims processing opportunity?
  - rule_type: detailed_rule
    parent_trend_id: 9
    research_considerations: Analyst to determine volume of Final Claims
    why: null
    flags:
      clinical: false
      network: false
      ops: true
    cost_of_care_suggestions: Has final claim been adjudicated per contractual obligation?
  - rule_type: detailed_rule
    parent_trend_id: 9
    research_considerations: Analyst to determine volume of First Claims
    why: null
    flags:
      clinical: false
      network: false
      ops: true
    cost_of_care_suggestions: Have all first claims been zeroed out in favor of the
      final bill?  Claims processing opportunity?
  - rule_type: trend_category
    trend_id: 10
    research_considerations: Analyst to review Reimbursement Method
    why: Are authorization denials being appropriately enforced?
    flags:
      clinical: false
      network: false
      ops: false
    cost_of_care_suggestions: null
  - rule_type: detailed_rule
    parent_trend_id: 10
    research_considerations: Analyst to determine if claim paid Per Diem/DRG/POC/SCA/Case
