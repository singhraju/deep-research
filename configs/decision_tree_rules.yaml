    why: Is variance a product of changes in reimbursement methodology?
    flags:
      clinical: false
      network: true
      ops: false
    cost_of_care_suggestions: Confirm that claims are processing per contractual obligation?
  - rule_type: detailed_rule
    parent_trend_id: 10
    research_considerations: Analyst to review billed charges
    why: Is variance a product of increased chargemaster exposure?
    flags:
      clinical: false
      network: true
      ops: false
    cost_of_care_suggestions: Program Integrity opportunity?  Chargemaster protection?
  - rule_type: detailed_rule
    parent_trend_id: 10
    research_considerations: Analyst to review outlier status
    why: Are large claims weighting unit cost higher?
    flags:
      clinical: false
      network: true
      ops: false
    cost_of_care_suggestions: Review discharge planning processes including timing
      of step down?
  - rule_type: detailed_rule
    parent_trend_id: 10
    research_considerations: Analyst to review auto adjudication vs manually processed
      rate
    why: Is variance a product of more or less auto-adjudication?
    flags:
      clinical: false
      network: false
      ops: true
    cost_of_care_suggestions: Ensure manual adjudication is not overwriting key edits
