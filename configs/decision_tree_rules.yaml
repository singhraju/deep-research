  - rule_type: detailed_rule
    parent_trend_id: 10
    research_considerations: Analyst to review impact of High Cost claims (>$250K
      or set plan specific threshold)
    why: Are large claims weighting unit cost higher?
    flags:
      clinical: false
      network: true
      ops: false
    cost_of_care_suggestions: Ensure itemized bill review?
