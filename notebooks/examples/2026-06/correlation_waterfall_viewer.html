                html += `<td class="numeric">${formatSignedMoney(getMetricDelta(cell, 'paid_pmpm'))}</td>`;
                html += `<td><span class="signal-badge signal-${signal}">${signal.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</span></td>`;
                html += '</tr>';
            });

            // Offset cells
            offsetCells.forEach(cell => {
                const label = buildClinicalLabel(cell);
                const signal = deriveSignal(cell);
                
                html += '<tr>';
                html += '<td><span class="cell-type-offset">Offset</span></td>';
                html += `<td>${truncateWithTooltip(label, 80)}</td>`;
                html += `<td class="numeric">${formatSignedMoney(cell.delta_value || 0)}</td>`;
                html += `<td class="numeric">${formatPercent(cell.share_of_net_delta || 0)}</td>`;
                html += `<td class="numeric">${formatSignedInteger(getMetricDelta(cell, 'expense_detail.claim_count'))}</td>`;
                html += `<td class="numeric">${formatSignedInteger(getMetricDelta(cell, 'expense_detail.total_admissions'))}</td>`;
                html += `<td class="numeric">${formatSignedMoney(getMetricDelta(cell, 'expense_detail.avg_paid_per_admit'))}</td>`;
                html += `<td class="numeric">${formatSignedMoney(getMetricDelta(cell, 'paid_pmpm'))}</td>`;
                html += `<td><span class="signal-badge signal-${signal}">${signal.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</span></td>`;
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            return html;
        }

        function renderRecommendations(recData) {
            let html = '';
            
            // Determine if this is the new format (array) or old format (object)
            const isNewFormat = Array.isArray(recData);
            
            // Executive Summary Box (old format only)
            if (!isNewFormat && recData.summary) {
                const summary = recData.summary;
                html += '<div class="executive-summary-box">';
                html += '<h3>📊 Executive Summary</h3>';
                
                if (summary.overall_pattern) {
                    html += `<p><strong>Overall Pattern:</strong> ${escapeHtml(summary.overall_pattern)}</p>`;
                }
                
                if (summary.primary_next_action) {
                    html += `<p><strong>Primary Next Action:</strong> ${escapeHtml(summary.primary_next_action)}</p>`;
                }
                
                if (summary.do_not_overgeneralize) {
                    html += `<p><strong>Important Context:</strong> ${escapeHtml(summary.do_not_overgeneralize)}</p>`;
                }
                
                html += '</div>';
            }

            // Get recommendation items
            const items = isNewFormat ? recData : (recData.items || recData.recommendations || []);
            
            if (items.length === 0) {
                return html + '<div style="padding: 20px; text-align: center; color: #6c757d;">No recommendations available.</div>';
            }

            html += '<div class="recommendations-grid">';
            
            items.forEach((rec, idx) => {
                // Parse legacy format if needed
                let recItem;
                try {
                    recItem = typeof rec.text === 'string' ? JSON.parse(rec.text) : rec;
                } catch (e) {
                    recItem = rec;
                }

                // New format fields
                const rank = recItem.rank || idx + 1;
                const priority = recItem.priority || 'MEDIUM';
                const category = recItem.category || 'General';
                const description = recItem.description || '';
                const evidence = recItem.evidence || [];
                const storyAlignment = recItem.story_alignment || [];
                const peerBenchmarking = recItem.peer_benchmarking || [];
                
                // Old format fallbacks
                const execRec = description || recItem.executive_recommendation || recItem.action || recItem.text || '';
                const reviewArea = category.toLowerCase().replace(/ /g, '_') || recItem.review_area || 'general';
                const confidence = recItem.confidence || 'Medium';
                const oldEvidence = recItem.evidence && typeof recItem.evidence === 'object' && !Array.isArray(recItem.evidence) ? recItem.evidence : null;

                // Parse story_alignment for special sections
                let whyText = '';
                let researchConsideration = '';
                let costSuggestion = '';
                storyAlignment.forEach(line => {
                    if (line.startsWith('Why:')) {
                        whyText = line.substring(4).trim();
                    } else if (line.startsWith('research_consideration:')) {
                        researchConsideration = line.substring(23).trim();
                    } else if (line.startsWith('cost_of_care_suggestion:')) {
                        costSuggestion = line.substring(24).trim();
                    }
                });

                // Fallback to old format
                if (!whyText) whyText = recItem.why || recItem.rationale || '';
                if (!researchConsideration) researchConsideration = recItem.research_consideration || '';
                if (!costSuggestion) costSuggestion = recItem.cost_of_care_suggestion || '';

                const reviewAreaLabel = category || reviewArea.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                const evidenceId = `evidence-${idx}`;

                html += '<div class="recommendation-card">';
                
                // Header: Priority, Category/Review Area, Confidence (if old format)
                html += '<div class="recommendation-header">';
                html += `<span class="priority-badge">${priority}</span>`;
                html += `<span class="review-area-badge review-area-${reviewArea}">${reviewAreaLabel}</span>`;
                if (confidence && confidence !== 'Medium') {
                    html += `<span class="confidence-badge confidence-${confidence}">${confidence}</span>`;
                }
                html += '</div>';

                // Main recommendation text
                html += `<div class="exec-recommendation">${escapeHtml(execRec)}</div>`;

                // Research Consideration
                if (researchConsideration) {
                    html += `<div class="research-consideration"><strong>Research:</strong> ${escapeHtml(researchConsideration)}</div>`;
                }

                // Cost of Care Suggestion
                if (costSuggestion) {
                    html += `<div class="cost-suggestion"><strong>Cost Action:</strong> ${escapeHtml(costSuggestion)}</div>`;
                }

                // Why section
                if (whyText) {
                    html += `<div class="why-section">${escapeHtml(whyText)}</div>`;
                }

                // Caveat section (old format only)
                if (recItem.caveat) {
                    html += `<div class="caveat-section"><strong>⚠️ Caveat:</strong> ${escapeHtml(recItem.caveat)}</div>`;
                }

                // Evidence toggle - handle both new array format and old object format
                const hasNewEvidence = Array.isArray(evidence) && evidence.length > 0;
                const hasPeerBenchmarking = Array.isArray(peerBenchmarking) && peerBenchmarking.length > 0;
                const hasOldEvidence = oldEvidence && (oldEvidence.drill_dimensions || oldEvidence.interaction_cell_ids || oldEvidence.offset_cell_ids || oldEvidence.key_metrics);
                
                if (hasNewEvidence || hasPeerBenchmarking || hasOldEvidence) {
                    html += `<div class="evidence-toggle" onclick="toggleEvidence('${evidenceId}')">`;
                    html += '<span>View Supporting Evidence</span> <span id="arrow-' + evidenceId + '">▼</span>';
                    html += '</div>';
                    
                    html += `<div id="${evidenceId}" class="evidence-content">`;
                    html += '<div class="evidence-section">';

                    // New format: Evidence array
                    if (hasNewEvidence) {
                        html += '<h5>Evidence</h5>';
                        html += '<ul class="evidence-list">';
                        evidence.forEach(item => {
                            html += `<li>${escapeHtml(item)}</li>`;
                        });
                        html += '</ul>';
                    }

                    // New format: Peer Benchmarking
                    if (hasPeerBenchmarking) {
                        html += '<h5 style="margin-top: 12px;">Peer Benchmarking</h5>';
                        html += '<ul class="evidence-list">';
                        peerBenchmarking.forEach(item => {
                            html += `<li>${escapeHtml(item)}</li>`;
                        });
                        html += '</ul>';
                    }

                    // Old format: Structured evidence
                    if (hasOldEvidence) {
                        // Drill dimensions
                        if (oldEvidence.drill_dimensions && oldEvidence.drill_dimensions.length > 0) {
                            html += '<h5>Drill Path Evidence</h5>';
                            html += '<div>';
                            oldEvidence.drill_dimensions.forEach(dim => {
                                html += `<span class="dimension-badge">${escapeHtml(dim)}</span>`;
                            });
                            html += '</div>';
                        }

                        // Interaction cells
                        if (oldEvidence.interaction_cell_ids && oldEvidence.interaction_cell_ids.length > 0) {
                            html += '<h5 style="margin-top: 12px;">Operational Cells</h5>';
                            html += '<div class="recommendation-cells">';
                            oldEvidence.interaction_cell_ids.forEach(cellId => {
                                html += `<span class="cell-badge">${cellId.toUpperCase()}</span>`;
                            });
                            html += '</div>';
                        }

                        // Offset cells
                        if (oldEvidence.offset_cell_ids && oldEvidence.offset_cell_ids.length > 0) {
                            html += '<h5 style="margin-top: 12px;">Clinical Offset Cells</h5>';
                            html += '<div class="recommendation-cells">';
                            oldEvidence.offset_cell_ids.forEach(cellId => {
                                html += `<span class="cell-badge">${cellId.toUpperCase()}</span>`;
                            });
                            html += '</div>';
                        }

                        // Key metrics
                        if (oldEvidence.key_metrics && oldEvidence.key_metrics.length > 0) {
                            html += '<h5 style="margin-top: 12px;">Key Metrics</h5>';
                            html += '<ul class="evidence-list">';
                            oldEvidence.key_metrics.forEach(metric => {
                                html += `<li>${escapeHtml(metric)}</li>`;
                            });
                            html += '</ul>';
                        }
                    }

                    html += '</div></div>';
                }

                html += '</div>';
            });
            
            html += '</div>';
            return html;
        }

        function toggleEvidence(evidenceId) {
            const content = document.getElementById(evidenceId);
            const arrow = document.getElementById('arrow-' + evidenceId);
            
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                arrow.textContent = '▼';
            } else {
                content.classList.add('expanded');
                arrow.textContent = '▲';
            }
        }

        function renderRawDetailsSection(operationalCells, clinicalCells, offsetCells) {
            let html = '<div class="collapsed-section">';
            html += '<div class="collapsed-header" onclick="toggleCollapsedSection(this)">View raw selected cells <span>▼</span></div>';
            html += '<div class="collapsed-content">';
            
            // Operational cards
            if (operationalCells.length > 0) {
                html += '<h4 style="margin-top: 0;">Operational Cells</h4>';
                html += '<div class="interaction-cells-grid">';
                operationalCells.forEach(cell => {
                    html += renderInteractionCell(cell, 'operational');
                });
                html += '</div>';
            }

            // Clinical cards
            if (clinicalCells.length > 0) {
                html += '<h4>Clinical Cells</h4>';
                html += '<div class="interaction-cells-grid">';
                clinicalCells.forEach(cell => {
                    html += renderInteractionCell(cell, 'clinical');
                });
                html += '</div>';
            }

            // Offset cards
            if (offsetCells.length > 0) {
                html += '<h4>Clinical Offset Cells</h4>';
                html += '<div class="interaction-cells-grid">';
                offsetCells.forEach(cell => {
                    html += renderInteractionCell(cell, 'offset');
                });
                html += '</div>';
            }

            html += '</div></div>';
            return html;
        }

        function toggleCollapsedSection(header) {
            const content = header.nextElementSibling;
            const arrow = header.querySelector('span');
            content.classList.toggle('expanded');
            arrow.textContent = content.classList.contains('expanded') ? '▲' : '▼';
        }

        function renderInteractionMatrixEmpty(matrix) {
            const summary = matrix.summary || {};
            const interactionStage = summary.interaction_stage || {};
            const clinicalStage = summary.clinical_stage || {};
            const operational = matrix.operational || {};

            let html = '<div class="interaction-matrix-container">';
            html += '<div class="interaction-section" style="background: #e7f3ff; border-color: #17a2b8;">';
            html += '<div class="interaction-title">🔍 Detected Interactions</div>';
            
            html += '<div style="padding: 15px; background: white; border-radius: 6px; border-left: 4px solid #17a2b8; margin-bottom: 15px;">';
            html += '<p style="margin: 0; color: #0c5460; font-weight: 600;">ℹ️ Analysis Ran But Found No Significant Cells</p>';
            html += '<p style="margin: 10px 0 0 0; color: #0c5460;">';
            html += 'The interaction matrix analysis executed successfully, but no operational cells met the selection criteria. ';
            html += 'This typically means the delta values were below the minimum thresholds or the share percentages were too small.';
            html += '</p></div>';

            if (interactionStage.passed !== undefined) {
                html += '<div style="background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #dee2e6;">';
                html += '<div style="font-weight: 600; color: #495057; margin-bottom: 10px; font-size: 1.1em;">📊 Analysis Status</div>';
                
                html += '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px;">';
                
                html += '<div style="padding: 10px; background: ' + (interactionStage.passed ? '#d4edda' : '#f8d7da') + '; border-radius: 6px;">';
                html += '<div style="font-size: 0.85em; color: #6c757d; margin-bottom: 4px;">Interaction Stage</div>';
                html += '<div style="font-weight: 600; color: ' + (interactionStage.passed ? '#155724' : '#721c24') + ';">'
                html += (interactionStage.passed ? '✅ Passed' : '❌ Failed') + '</div>';
                html += '</div>';
                
                html += '<div style="padding: 10px; background: #f8f9fa; border-radius: 6px;">';
                html += '<div style="font-size: 0.85em; color: #6c757d; margin-bottom: 4px;">Drill Path Depth</div>';
                html += '<div style="font-weight: 600; color: #212529;">' + (interactionStage.observed_drill_path_depth || 0) + ' levels</div>';
                html += '</div>';
                
                html += '<div style="padding: 10px; background: #f8f9fa; border-radius: 6px;">';
                html += '<div style="font-size: 0.85em; color: #6c757d; margin-bottom: 4px;">Min Delta Threshold</div>';
                html += '<div style="font-weight: 600; color: #212529;">' + formatCurrency(interactionStage.min_abs_net_delta || 0) + '</div>';
                html += '</div>';
                
                html += '<div style="padding: 10px; background: ' + (clinicalStage.passed ? '#d4edda' : '#f8d7da') + '; border-radius: 6px;">';
                html += '<div style="font-size: 0.85em; color: #6c757d; margin-bottom: 4px;">Clinical Stage</div>';
                html += '<div style="font-weight: 600; color: ' + (clinicalStage.passed ? '#155724' : '#721c24') + ';">'
                html += (clinicalStage.passed ? '✅ Passed' : '❌ Not Run') + '</div>';
                html += '</div>';
                
                html += '</div></div>';
            }

            if (operational.dimensions && operational.dimensions.length > 0) {
                html += '<div style="background: white; border-radius: 8px; padding: 15px; border: 1px solid #dee2e6;">';
                html += '<div style="font-weight: 600; color: #495057; margin-bottom: 10px; font-size: 1.1em;">🔧 Configuration</div>';
                html += '<div style="margin-bottom: 10px;"><strong>Operational Dimensions:</strong></div>';
                html += '<div style="display: flex; flex-wrap: wrap; gap: 8px;">';
                operational.dimensions.forEach(dim => {
                    html += '<span style="background: #e9ecef; padding: 6px 12px; border-radius: 6px; font-size: 0.9em;">' + escapeHtml(dim) + '</span>';
                });
                html += '</div>';
                
                if (operational.selected_cells && operational.selected_cells.length === 0) {
                    html += '<div style="margin-top: 15px; padding: 10px; background: #fff3cd; border-left: 3px solid #ffc107; border-radius: 4px;">';
                    html += '<div style="color: #856404;"><strong>💡 Tip:</strong> No cells met the selection criteria. This could be because:</div>';
                    html += '<ul style="margin: 8px 0 0 20px; color: #856404;">';
                    html += '<li>Delta values were below the minimum positive delta threshold</li>';
                    html += '<li>Share of positive delta was too small</li>';
                    html += '<li>All deltas were negative</li>';
                    html += '</ul></div>';
                }
                html += '</div>';
            }

            html += '</div></div>';
            return html;
        }

        function renderInteractionCell(cell, type) {
            const deltaClass = cell.delta_value >= 0 ? 'positive' : 'negative';
            const deltaSign = cell.delta_value >= 0 ? '+' : '';
            
            let html = `<div class="interaction-cell ${type}">`;
            
            html += '<div class="cell-header">';
            html += `<div class="cell-id">${cell.cell_id.toUpperCase()}</div>`;
            html += `<div class="cell-delta ${deltaClass}">${deltaSign}${formatCurrencyWithSign(cell.delta_value)}</div>`;
            html += '</div>';

            if (cell.dimension_values) {
                html += '<div class="cell-dimensions">';
                for (const [key, value] of Object.entries(cell.dimension_values)) {
                    html += `
                        <div class="dimension-item">
                            <span class="dimension-key">${escapeHtml(key)}:</span>
                            <span class="dimension-value">${escapeHtml(value)}</span>
                        </div>
                    `;
                }
                html += '</div>';
            }

            html += '<div class="cell-metrics">';
            html += `
                <div class="cell-metric-item">
                    <span class="cell-metric-label">Baseline</span>
                    <span class="cell-metric-value">${formatCurrencyWithSign(cell.baseline_value)}</span>
                </div>
                <div class="cell-metric-item">
                    <span class="cell-metric-label">Comparison</span>
                    <span class="cell-metric-value">${formatCurrencyWithSign(cell.comparison_value)}</span>
                </div>
                <div class="cell-metric-item">
                    <span class="cell-metric-label">Share of +Δ</span>
                    <span class="cell-metric-value">${formatPercent(cell.share_of_positive_delta)}</span>
                </div>
                <div class="cell-metric-item">
                    <span class="cell-metric-label">Share of Net Δ</span>
                    <span class="cell-metric-value">${formatPercent(cell.share_of_net_delta)}</span>
                </div>
            `;
            html += '</div>';

            html += '</div>';
            return html;
        }

        function renderLevel(level, index) {
            let html = `
                <div class="level-card">
                    <div class="level-header">
                        <div class="level-title">Level ${level.level}: ${level.dimension_label}</div>
                        <div class="level-badge">Dimension: ${level.dimension}</div>
                    </div>
            `;

            if (level.parent_context && level.parent_context !== 'root') {
                html += `
                    <div class="level-context">
                        <strong>Context:</strong> ${level.parent_context}
                    </div>
                `;
            }

            html += `<div class="segments-container">`;

            if (level.top_segments && level.top_segments.length > 0) {
                const segmentsToShow = level.top_segments.slice(0, 5);
                
                segmentsToShow.forEach((segment, segIndex) => {
                    html += renderSegment(segment, segIndex + 1);
                });
            } else {
                html += `<p style="text-align: center; color: #6c757d;">No top segments available for this level.</p>`;
            }

            html += `</div></div>`;

            return html;
        }

        function renderSegment(segment, rank) {
            const deltaClass = segment.delta_value >= 0 ? 'positive' : 'negative';
            const deltaSign = segment.delta_value >= 0 ? '+' : '';
            const contributionPct = Math.abs(segment.contribution_pct_total * 100);
            const contributionParentPct = Math.abs(segment.contribution_pct_parent * 100);

            return `
                <div class="segment-card ${deltaClass}">
                    <div class="segment-header">
                        <div>
                            <div style="font-size: 0.9em; color: #6c757d; margin-bottom: 5px;">Rank #${rank}</div>
                            <div class="segment-name">${segment.value}</div>
                        </div>
                        <div class="segment-delta ${deltaClass}">
                            ${deltaSign}${formatCurrency(segment.delta_value)}
                        </div>
                    </div>

                    <div class="segment-metrics">
                        <div class="metric">
                            <div class="metric-label">Baseline Value</div>
                            <div class="metric-value">${formatCurrency(segment.baseline_value)}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Comparison Value</div>
                            <div class="metric-value">${formatCurrency(segment.comparison_value)}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Contribution to Total</div>
                            <div class="metric-value">${formatPercent(segment.contribution_pct_total)}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Contribution to Parent</div>
                            <div class="metric-value">${formatPercent(segment.contribution_pct_parent)}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Baseline Count</div>
                            <div class="metric-value">${formatNumber(segment.raw_row_count_baseline)}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Comparison Count</div>
                            <div class="metric-value">${formatNumber(segment.raw_row_count_comparison)}</div>
                        </div>
                    </div>

                    <div class="progress-bar">
                        <div class="progress-fill ${deltaClass}" style="width: ${Math.min(contributionPct, 100)}%"></div>
                    </div>
                </div>
            `;
        }

        function saveRenderedHTML() {
            console.log('saveRenderedHTML function started');
            try {
                // Get the original filename
                const originalFilename = document.getElementById('jsonFile').files[0]?.name || 'correlation_results.json';
                console.log('Original filename:', originalFilename);
                
                // Read the current page HTML
                const currentHTML = document.documentElement.outerHTML;
                console.log('Current HTML length:', currentHTML.length);
                
                // Find the script section
                const scriptStartMarker = 'let currentData = null;';
                const scriptStartIndex = currentHTML.indexOf(scriptStartMarker);
                console.log('Script start index:', scriptStartIndex);
                
                if (scriptStartIndex === -1) {
                    alert('Error: Could not find script section to modify.');
                    return;
                }
                
                // Find the next line after variable declarations
                const allResultsMarker = 'let allResults = null;';
                const allResultsIndex = currentHTML.indexOf(allResultsMarker, scriptStartIndex);
                
                if (allResultsIndex === -1) {
                    alert('Error: Could not find allResults variable.');
                    return;
                }
                
                // Replace "let allResults = null;" with embedded data
                const beforeAllResults = currentHTML.substring(0, allResultsIndex);
                const afterAllResults = currentHTML.substring(allResultsIndex + allResultsMarker.length);
                
                // Create the embedded data initialization
                const embeddedDataInit = `let allResults = ${JSON.stringify(allResults)};
        
        // Auto-populate on page load with embedded data
        window.addEventListener('DOMContentLoaded', function() {
            if (allResults) {
                console.log('Auto-loading embedded data...');
                parseAndDisplayMetadata('${originalFilename}');
                populateDropdowns();
                document.getElementById('saveRenderedBtn').textContent = '✓ Data Embedded';
                document.getElementById('saveRenderedBtn').title = 'Data is already embedded. Use Ctrl+S to save this file.';
                document.getElementById('jsonFile').disabled = true;
            }
        });`;
                
                // Build the new HTML
                const newHTML = beforeAllResults + embeddedDataInit + afterAllResults;
                console.log('New HTML length:', newHTML.length);
                
                // Create blob and download
                const blob = new Blob([newHTML], { type: 'text/html;charset=utf-8' });
                console.log('Blob created, size:', blob.size);
                
                const url = URL.createObjectURL(blob);
                console.log('Blob URL created:', url);
                
                // Create download filename based on original JSON filename
                let downloadFilename = 'correlation_waterfall_rendered.html';
                if (originalFilename) {
                    // Remove .json extension and add _rendered.html
                    const baseName = originalFilename.replace(/\.json$/i, '');
                    downloadFilename = `${baseName}_rendered.html`;
                }
                
                const a = document.createElement('a');
                a.href = url;
                a.download = downloadFilename;
                a.style.display = 'none';
                document.body.appendChild(a);
                console.log('Triggering download:', downloadFilename);
                a.click();
                
                // Cleanup
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    console.log('Download complete!');
                }, 100);
                
                alert(`✓ Rendered HTML saved!\n\nThe file "${downloadFilename}" has been downloaded.`);
                
            } catch (error) {
                console.error('Error saving rendered HTML:', error);
                alert('Error saving file: ' + error.message + '\n\nCheck the browser console for details.');
            }
        }
    </script>
