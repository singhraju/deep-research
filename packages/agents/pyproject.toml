[project]
name = "deep-research-agents"
version = "2.0.0"
description = "Agent implementations for deep-research project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddtrace>=4.10.4",
    "deep-research-core",
    "deep-research-utils",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
