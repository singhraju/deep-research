[project]
name = "deep-research-utils"
version = "2.0.1"
description = "Utility libraries for deep-research project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "requests>=2.33.1",
    "snowflake-connector-python>=4.4.0",
    "snowflake-snowpark-python>=1.48.1",
    "cachetools>=5.3,<6.0",
    "httpx>=0.26,<1.0",
    "redis>=5.0.0,<6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research_utils"]
