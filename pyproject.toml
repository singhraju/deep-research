[project]
name = "deep-research"
version = "2.0.4"
description = "Deep research project for healthcare data science"
readme = "README.MD"
requires-python = ">=3.13"
dependencies = [
    "deep-research-core",
    "deep-research-utils",
    "deep-research-agents",
    "fastapi>=0.135.3",
    "uvicorn==0.46.0",
    "jupyter>=1.1.1",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.4",
    "openai>=2.30.0",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "snowflake-connector-python>=3.0.0",
    "snowflake-snowpark-python>=1.11.0",
    "flexible-snowflake-connector",
    "streamlit>=1.56.0",
    "streamlit-extras>=0.4.0",
    "plotly>=6.0.0,<7",
    "tenacity==9.1.4",
    "boto3>=1.28.0",
    "cryptography>=46.0.5",
    "pyOpenSSL>=23.0.0",
    "requests>=2.31.0",
    "pyspark>=3.3.0",
    "openpyxl>=3.1.5",
    "reportlab>=5.0.0",
    "kaleido>=1.3.0",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pypdf>=6.14.2",
    "pytest>=9.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Don't auto-discover packages - we're using workspace members
packages = []

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.uv]
package = false

[tool.uv.sources]
deep-research-core = { workspace = true }
deep-research-utils = { workspace = true }
deep-research-agents = { workspace = true }
flexible-snowflake-connector = { path = "flexible_snowflake_connector-1.0.0-py3-none-any.whl" }

[tool.uv.workspace]
members = ["packages/*"]
